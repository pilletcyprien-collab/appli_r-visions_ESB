            {q:"Quelle est la pondération entre l'évaluation commune et l'évaluation CAO dans le bloc Écoconception ?", a:"L'évaluation commune (analyse fonctionnelle, conception, procédés, matériaux, droit de l'environnement, écoconception, ACV, fin de vie, aide à la décision) compte pour 70% ; l'évaluation CAO compte pour 30%.", d:["Les deux évaluations comptent chacune pour 50% de la note finale du bloc Écoconception.","C'est l'évaluation CAO qui compte pour 70%, l'évaluation commune ne pesant que pour 30%.","Seule l'évaluation commune est prise en compte, l'évaluation CAO n'étant qu'indicative sans impact sur la note."], w:"Avec 70% sur l'évaluation commune, c'est elle qui pèse le plus lourd dans la note finale du bloc : à prioriser en révision si le temps manque, contrairement à un équilibre 50/50, un rapport inversé ou une évaluation CAO purement indicative."},
            {q:"Quel est le format de l'évaluation commune du bloc Écoconception ?", a:"Des questions de cours (QCM + questions ouvertes) et une étude de cas (QCM + questions ouvertes), plus un QCM e-learning sur 1 point (prise en main de Granta).", d:["Un oral individuel uniquement, sans aucune épreuve écrite.","Un rapport d'ACV complet, à réaliser et à rendre en groupe de plusieurs apprentis.","Un QCM seul, sans aucune question ouverte ni étude de cas associée."], w:"Le format mélange restitution de connaissances (questions de cours) et mise en situation (étude de cas), plus un petit QCM e-learning sur Granta : il faut savoir autant réciter qu'appliquer, pas seulement préparer un oral, un rapport de groupe ou un QCM isolé."},
            {q:"Quelle compétence les apprentis doivent-ils valider en décembre dans le cadre de ce bloc ?", a:"Analyser les résultats d'une ACV simplifiée et identifier les étapes les plus impactantes (revue critique sur un périmètre restreint).", d:["Réaliser une ACV complète normée ISO 14044 sur un produit industriel, du périmètre à l'interprétation des résultats.","Déposer un brevet auprès de l'INPI pour une innovation technique développée pendant le bloc.","Concevoir et mettre en route une ligne de production automatisée pour un produit donné."], w:"C'est une compétence d'analyse critique, pas de calcul exhaustif : repérer les étapes les plus impactantes compte plus que maîtriser tous les détails méthodologiques d'une ACV normée complète, déposer un brevet ou concevoir une ligne de production."},
            {q:"Qu'est-ce que \"Les Transitionneurs\" à l'ESB ?", a:"L'incubateur de projets responsables de l'école, qui accompagne les enseignements sur la soutenabilité (fresque du climat, atelier 2 tonnes, écoconception, chaîne de valeur responsable...) sur les 3 années de formation.", d:["Le nom commercial du logiciel d'analyse du cycle de vie utilisé pendant les cours d'écoconception.","Un club sportif de l'école, ouvert aux étudiants souhaitant pratiquer une activité physique en dehors des cours.","Le nom du bureau d'étude partenaire de l'école pour l'accueil des stagiaires et apprentis."], w:"Le nom à retenir si une question porte sur l'organisation de la soutenabilité à l'ESB plutôt que sur le contenu technique de l'écoconception ; ce n'est ni un logiciel, ni un club sportif, ni un bureau d'étude partenaire."}
          ]
        },
        {
          id: "cas",
          title: "Étude de cas : outils d'évaluation (table rabattable)",
          cards: [
            {q:"Qu'est-ce qu'un diagramme FAST (Function Analysis System Technique) ?", a:"Un outil qui décompose une fonction de service en fonctions techniques puis en solutions techniques, en répondant à la question \"comment\" de la gauche vers la droite.", d:["Un planning de production affiché sous la forme d'un diagramme de Gantt, réparti par poste de travail.","Une méthode de calcul du coût de revient complet d'un produit, poste de dépense par poste de dépense.","Un indicateur de performance environnementale normé ISO, utilisé pour comparer deux produits entre eux."], w:"Le FAST part toujours du cahier des charges fonctionnel : chaque fonction de service du CdCF devient la racine d'un arbre de solutions techniques ; ce n'est ni un planning, ni un calcul de coût, ni un indicateur environnemental normé."},
            {q:"Dans un AMDEC Produit, que signifient les notes G, F et D ?", a:"Gravité, Fréquence d'occurrence et Détection : trois notes combinées pour calculer la criticité d'une défaillance.", d:["Garantie, Fabrication et Durée de vie, trois critères utilisés pour qualifier commercialement un produit.","Gain, Faisabilité et Délai de mise sur le marché, trois critères utilisés en gestion de projet.","Génération, Finition et Distribution, trois étapes du cycle de vie commercial d'un produit."], w:"La criticité (souvent G×F×D) sert ensuite à hiérarchiser les défaillances : plus elle est élevée, plus l'action corrective est prioritaire ; ces trois lettres ne renvoient ni à des critères commerciaux, ni à de la gestion de projet, ni à des étapes de cycle de vie."},
            {q:"Quel est l'objectif d'un diagramme Ishikawa (diagramme en arêtes de poisson) ?", a:"Identifier de façon structurée les causes possibles d'une défaillance ou d'un problème, souvent classées en familles (matière, méthode, main-d'œuvre, matériel, milieu).", d:["Calculer la criticité d'une défaillance à partir de sa seule fréquence d'occurrence observée.","Planifier dans le temps l'ensemble des tâches à réaliser au cours d'un projet de conception.","Comparer les forces et les faiblesses d'un produit par rapport à ceux de la concurrence."], w:"L'Ishikawa précède généralement l'AMDEC : il sert à lister les causes de défaillance par fonction, qui sont ensuite intégrées et notées dans le tableau AMDEC ; il ne calcule pas de criticité, ne planifie rien et ne compare pas à la concurrence."},
            {q:"Que permet un diagramme de Pareto appliqué aux défaillances d'un AMDEC ?", a:"Identifier les défaillances prioritaires en classant les causes par fréquence décroissante et en traçant la courbe des fréquences cumulées (logique des 80/20).", d:["Calculer le prix de revient total du produit en intégrant l'ensemble des coûts de non-qualité.","Mesurer l'empreinte carbone du produit sur l'ensemble de son cycle de vie, de l'extraction à la fin de vie.","Déterminer la durée de vie moyenne du produit, à partir des retours constatés en service après-vente."], w:"Le principe des 80/20 suppose qu'une minorité de causes (zone A du Pareto) concentre la majorité des défaillances à traiter en priorité ; ce n'est ni un calcul de coût, ni une mesure d'empreinte carbone, ni une estimation de durée de vie."},
            {q:"Dans une analyse SWOT appliquée à un concept de produit, que distingue-t-on ?", a:"Forces et Faiblesses (internes au concept) d'un côté, Opportunités et Menaces (externes, liées au contexte/marché) de l'autre.", d:["Les coûts fixes du projet d'un côté, ses coûts variables de l'autre, pour construire le plan de financement.","Les fonctions principales du cahier des charges d'un côté, ses fonctions contraintes de l'autre.","Les étapes amont du cycle de vie du produit d'un côté, ses étapes aval de l'autre."], w:"Classer un constat en \"interne\" ou \"externe\" est l'erreur la plus fréquente dans un SWOT : il faut se demander si le concept lui-même en est la cause, ou le contexte extérieur, pas opposer coûts fixes/variables, fonctions principales/contraintes, ou amont/aval du cycle de vie."},
            {q:"Pour choisir le matériau d'une poutre en flexion (ex : plateau de table), quelle est la première étape de la méthode de l'indice de performance ?", a:"Définir la fonction, la contrainte (ex : flèche maximale admissible) et l'objectif (ex : minimiser la masse) avant toute formule.", d:["Consulter directement le prix au kilogramme de chacun des matériaux candidats à l'étude.","Choisir d'emblée le matériau le plus couramment utilisé dans l'industrie du meuble pour ce type de pièce.","Mesurer le module d'Young de tous les matériaux disponibles dans la base de données, avant toute autre considération."], w:"Sans fonction/contrainte/objectif clairement posés, on ne peut pas isoler la partie de l'équation qui ne dépend que du matériau, étape indispensable pour construire l'indice de performance ; consulter un prix, choisir par habitude ou mesurer en vrac ne remplace pas cette étape initiale."},
            {q:"Dans la méthode de l'indice de performance d'une poutre en flexion, pourquoi sépare-t-on les termes liés au système (longueur, charge) des termes liés au matériau (E, ρ) ?", a:"Parce que seul le terme ne dépendant que du matériau constitue l'indice de performance M à maximiser, indépendamment de la géométrie particulière étudiée.", d:["Parce que les termes géométriques de l'équation ne possèdent, par nature, aucune unité physique définie.","Parce que la base de données Granta ne renseigne que les propriétés du matériau, jamais aucune donnée géométrique.","Parce que la longueur d'une poutre est, dans tous les cas pratiques, négligeable devant son épaisseur."], w:"Cette séparation permet de réutiliser le même indice de performance pour n'importe quelle poutre de ce type, quelle que soit sa géométrie exacte ; ce n'est ni une question d'unité physique, ni une limite de la base Granta, ni une hypothèse générale sur les proportions de la poutre."},
            {q:"Sur un diagramme d'Ashby en échelle log-log (ex : module d'Young vs masse volumique), à quoi correspond la pente de la droite d'iso-performance ?", a:"À l'exposant de la masse volumique dans l'expression de l'indice de performance (ex : pente différente selon que l'indice s'écrit E/ρ ou E^(1/2)/ρ).", d:["Au prix moyen des matériaux qui sont représentés sur ce diagramme d'Ashby.","Au nombre total de matériaux candidats pris en compte dans l'étude.","À la température de service maximale que les matériaux étudiés peuvent supporter."], w:"Changer d'indice de performance (ex : barre résistante et légère vs poutre rigide et légère) change la pente de la droite, donc change aussi le classement des matériaux ; la pente n'a de lien direct ni avec le prix, ni avec le nombre de candidats, ni avec une température de service."},
            {q:"Pourquoi faut-il calculer une incertitude (ΔM) sur un indice de performance, et pas seulement sa valeur moyenne ?", a:"Parce que deux matériaux proches en valeur moyenne peuvent avoir des plages d'incertitude qui se chevauchent, rendant la décision \"A est meilleur que B\" peu robuste.", d:["Parce que la norme ISO 14040 impose formellement ce calcul pour toute comparaison de matériaux.","Parce que l'incertitude ainsi calculée permet ensuite de déduire directement le prix du matériau.","Parce que, sans cette incertitude calculée, le module d'Young du matériau ne pourrait tout simplement pas être mesuré."], w:"C'est le même principe de robustesse de la décision que celui vu en ACV : une différence non significative entre deux options ne permet pas de conclure avec confiance ; ce n'est ni une exigence de l'ISO 14040, ni un moyen de calculer un prix, ni une condition de mesure du module d'Young."},
            {q:"Dans un choix de matériau de poutre, que peut-il se passer quand on ajoute un critère de prix puis un critère environnemental (empreinte carbone) au critère technique initial ?", a:"Le matériau le plus performant peut changer à chaque ajout de critère : un matériau optimal techniquement n'est pas forcément le plus économique ni le plus écologique.", d:["Le classement des matériaux reste rigoureusement identique à chaque étape, seuls les chiffres affichés changent.","Le critère technique devient automatiquement secondaire dès qu'un critère économique est ajouté à l'étude.","L'ajout d'un nouveau critère n'est possible qu'après validation de la démarche par un organisme certificateur externe."], w:"C'est l'illustration concrète de l'approche multicritère de l'écoconception : un choix de matériau \"optimal\" dépend toujours des critères qu'on décide de croiser, et peut donc changer à chaque ajout, contrairement à un classement figé, une hiérarchie imposée entre critères, ou une validation externe obligatoire."},
            {q:"Pour un isolant d'étuve utilisée par cycles (arrêt/relance), pourquoi cherche-t-on un compromis entre faible conductivité thermique (λ) et faible capacité thermique massique (Cp) ?", a:"Une faible conductivité limite les pertes par conduction en régime stationnaire, mais une épaisseur d'isolant trop importante augmente l'énergie emmagasinée à chaque montée en température : il existe une épaisseur optimale qui minimise l'énergie perdue sur un cycle.", d:["Parce que Cp et λ seraient, pour un même matériau donné, toujours directement proportionnels l'un à l'autre.","Parce qu'une réglementation technique imposerait un seuil minimal de capacité thermique massique pour ce type d'équipement.","Parce que seule la conductivité thermique λ influencerait, au final, le coût d'achat de l'isolant retenu."], w:"Bon exemple de compromis propre à un usage cyclique, différent d'un usage en continu où seule la conductivité compterait ; ce n'est ni une proportionnalité Cp/λ, ni une contrainte réglementaire, ni une question de coût d'achat."},
            {q:"Dans un assemblage bi-matériaux soumis à des variations de température et d'humidité (ex : plancher bois-béton), d'où proviennent les contraintes à l'interface entre les deux matériaux ?", a:"Les deux matériaux se dilatent/contractent différemment (coefficients de dilatation thermique et hydrique différents) ; cette dilatation différentielle, empêchée par la liaison entre les matériaux, génère des contraintes normales puis une contrainte de cisaillement à l'interface.", d:["De la seule différence de masse volumique existant entre les deux matériaux mis en contact.","Du poids propre de la structure, qui génère ces contraintes indépendamment de toute variation de température.","D'un défaut de fabrication qui serait systématiquement présent au niveau de toute interface collée."], w:"Le bois a en plus une dilatation hydrique (liée à l'humidité) que le béton n'a pas : une source de contrainte supplémentaire propre aux assemblages bois en hygrométrie variable, qui ne vient ni d'un simple écart de masse volumique, ni du seul poids propre, ni d'un défaut de fabrication systématique."},
            {q:"Dans l'application de la roue de Brezet à la table de réunion rabattable, à quoi sert le diagramme radar en fin d'exercice ?", a:"Comparer visuellement le profil environnemental du produit de référence (existant) et celui du nouveau concept proposé, axe par axe, pour visualiser les progrès réalisés.", d:["Calculer précisément le coût de fabrication prévisionnel du nouveau concept de table proposé.","Remplacer entièrement la réalisation d'une ACV complète et normée du produit étudié.","Mesurer uniquement la durée de vie attendue du nouveau produit, sans autre indicateur associé."], w:"C'est un outil de communication et de décision, pas une mesure quantitative précise : il reste qualitatif (+/-), ce qui fait justement la simplicité de la roue de Brezet, et ne calcule ni coût, ni ACV complète, ni durée de vie seule."},
            {q:"Dans l'étude de cas de la table rabattable, pourquoi la phase \"divergente\" du brainstorming par axe de la roue de Brezet précède-t-elle toujours la phase \"convergente\" ?", a:"Pour éviter de filtrer trop tôt des idées sur des critères techniques ou économiques, et ne pas passer à côté d'idées environnementalement intéressantes jugées trop vite irréalistes.", d:["Parce que la phase convergente devrait, dans tous les cas, durer plus longtemps que la phase divergente qui la précède.","Parce qu'un texte réglementaire imposerait cet ordre précis pour toute démarche d'écoconception menée en entreprise.","Parce que la phase divergente, par construction, ne porterait jamais que sur les seuls aspects économiques du produit."], w:"C'est la règle vue dans le chapitre roue de Brezet : séparer \"générer\" et \"juger\" permet de ne pas tuer une idée originale trop tôt ; ce n'est ni une question de durée relative des deux phases, ni une obligation réglementaire, ni une limitation de la phase divergente aux aspects économiques."},
            {q:"Pour le plateau de la table rabattable, une étude technique (indice de performance) désigne le contreplaqué comme le matériau le plus performant, mais l'étude environnementale (empreinte carbone par unité fonctionnelle) désigne le bois massif local comme le plus favorable. Que doit faire l'équipe de conception face à ce résultat, au regard de la démarche multicritère vue en écoconception ?", a:"Elle doit arbitrer explicitement entre les deux critères plutôt que choisir automatiquement l'un ou l'autre, en documentant le compromis retenu (ex : accepter une performance technique légèrement moindre pour un gain environnemental plus net, ou l'inverse) dans la fiche projet.", d:["Elle doit obligatoirement retenir le résultat de l'étude technique, le critère environnemental n'étant que secondaire dans une démarche d'écoconception.","Elle doit recommencer l'étude technique, puisqu'un résultat différent entre deux études sur le même produit signale nécessairement une erreur de calcul.","Elle doit retenir un matériau totalement différent des deux proposés, pour éviter d'avoir à choisir entre les deux études contradictoires."], w:"C'est la synthèse de ce qui a été vu sur le choix multicritère d'un matériau de poutre : deux critères légitimes peuvent désigner deux matériaux différents, et la démarche d'écoconception consiste justement à arbitrer consciemment entre eux, pas à ignorer l'un, à soupçonner une erreur, ou à fuir le choix."}
          ]
        }
      ]
    }
  ];

          "Isoler le terme qui ne dépend que du <b>matériau</b> : c'est l'indice de performance M à maximiser (ex. poutre en flexion de section carrée libre : <b>M = √E / ρ</b>).",
          "Sur un diagramme d'Ashby log-log, la <b>pente</b> de la droite d'iso-performance correspond à l'exposant de ρ dans l'expression de M.",

          "Ajouter un critère de prix puis un critère environnemental peut changer le matériau le plus performant (approche multicritère)."
        ]},
        {h:"Cas particuliers vus en TD", items:[
          "Isolant en usage <b>cyclique</b> (étuve) : compromis entre faible conductivité (λ) et faible capacité thermique massique (Cp) → il existe une épaisseur optimale.",
          "Assemblage <b>bi-matériaux</b> (ex. bois-béton) : des dilatations thermiques/hydriques différentes, empêchées par la liaison, créent des contraintes normales puis une contrainte de cisaillement à l'interface.",
          "Roue de Brezet appliquée à un produit : le radar compare visuellement le produit de référence et le nouveau concept ; la phase divergente précède toujours la convergente pour ne pas tuer une idée trop tôt."
        ]}

  // -- TD corrigés (par Claude, à vérifier avec le prof) -----------------
  var TD_SHEETS = [
    {
      id:"td-materiau-table", eyebrow:"Multi-matériaux · cas d'étude", title:"Choix de matériau d'une table rabattable (indice de performance)",
      note:"Les formules et la démarche ci-dessous sont sûres. Les valeurs numériques (E, ρ, incertitudes, prix, empreinte carbone) dépendent de ta base Granta : relève-les toi-même et applique la méthode décrite ici.",
      items:[
        {q:"Quelle est la fonction principale de l'élément structurel en flexion d'une table ?", a:["Reprendre les efforts de flexion engendrés par les charges posées sur le plateau, et les transmettre au piètement, sans flèche excessive ni rupture."]},
        {q:"Au sens de l'analyse fonctionnelle, quelles seraient les contraintes associées à ce système structurel ? Ne pas confondre avec les contraintes mécaniques. En déduire les 2 limites à ne pas dépasser mécaniquement.", a:["Au sens AF, une contrainte est une limite imposée au concepteur (encombrement, poids transportable, budget, esthétique) — différente de la contrainte mécanique σ (force/surface).","Mécaniquement, les deux limites à ne pas dépasser sont : (1) la résistance (rupture ou plastification sous la contrainte maximale) et (2) la rigidité (flèche maximale admissible, au-delà de laquelle la table semble \"molle\" sans pour autant casser)."]},
        {q:"Quelle contrainte tend à dominer le dimensionnement d'éléments en flexion ?", a:["La rigidité (la flèche) domine en général le dimensionnement des poutres élancées en flexion, bien avant la limite de résistance à la rupture : un plateau de table est presque toujours dimensionné pour rester rigide au toucher, pas pour éviter la casse."]},
        {q:"Quel objectif va-t-on chercher à minimiser ou maximiser ?", a:["Minimiser la masse du plateau/piètement pour une rigidité donnée (flèche maximale fixée) : l'objectif classique de structure légère et rigide."]},
        {q:"Tracer un graphique de la contrainte retenue en fonction de l'objectif à optimiser (Level 2). Quel matériau serait le plus adapté ? Quelles critiques ?", a:["C'est le graphique \"Level 2\" d'Ashby : module d'Young E (ordonnée) en fonction de la masse volumique ρ (abscisse), échelle log-log.","En lisant seulement l'axe E, le matériau \"le plus adapté\" serait celui au module le plus élevé (acier, céramique technique) — mais cette lecture ignore complètement le poids.","Critique : comparer un seul axe isolément ne dit rien sur le compromis rigidité/poids réellement recherché. Il faut un indice qui combine les deux grandeurs (voir la suite du TD)."]},
        {q:"Réalisez le schéma statique de la table (efforts, longueurs, hypothèses de liaison).", a:["Modèle standard : poutre (le plateau ou une traverse) sur deux appuis simples (les deux montants du piètement), de portée L, chargée par un effort F appliqué au centre de la portée — cas isostatique classique.","Hypothèse de liaison : appui simple à chaque extrémité (réaction verticale uniquement, aucun moment transmis), cohérent avec une table posée sur deux pieds sans encastrement."]},
        {q:"Exprimer la raideur apparente k en flexion, puis en fonction de E, L et l'aire A (section carrée pleine).", a:["Définition : k = F / v (charge totale divisée par la flèche maximale).","Pour une poutre bi-appuyée à charge centrée : v_max = F·L³ / (48·E·I), donc k = 48·E·I / L³.","Pour une section carrée pleine de côté t (A = t², I = t⁴/12 = A²/12) : k = 4·E·A² / L³."]},
        {q:"Exprimer la masse m de la poutre en fonction des dimensions et de ρ.", a:["m = ρ · A · L (masse volumique × aire de section × longueur)."]},
        {q:"En combinant les deux expressions, exprimez m en fonction de L, k, E, ρ. Isolez les termes liés au système et au matériau. Écrivez l'indice de performance M à maximiser.", a:["De k = 4EA²/L³ on tire A = (kL³/(4E))^(1/2). En reportant dans m = ρAL : m = (k/4)^(1/2) · L^(5/2) · (ρ/√E).","Le groupe (k/4)^(1/2)·L^(5/2) ne dépend que du système (raideur cible, portée) ; le groupe ρ/√E ne dépend que du matériau.","Minimiser m revient à minimiser ρ/√E, donc à maximiser l'indice de performance <b>M = √E / ρ</b>."]},
        {q:"Tracer le graphique log(E) en fonction de log(ρ). Exprimez M en fonction des log. Quel coefficient directeur aura la droite d'iso-performance ?", a:["De M = √E/ρ on tire E = M²·ρ², donc log(E) = 2·log(ρ) + 2·log(M).","Sur un graphique log(E) vs log(ρ), les droites d'iso-performance (M constant) ont donc un coefficient directeur égal à <b>2</b>."]},
        {q:"Excluez céramiques techniques, mousses et élastomères. Quel matériau est le plus performant d'après l'indice M = √E/ρ ?", a:["Ce sont les matériaux combinant rigidité élevée et faible densité qui dominent cet indice : composites fibrés hautes performances (CFRP), mais aussi le bois et ses dérivés structurels (lamellé-collé, contreplaqué), qui se classent souvent étonnamment bien — parfois devant l'acier et l'aluminium sur ce critère précis, grâce à leur très faible densité."], flag:"Classement exact à vérifier dans ta base Granta : il dépend des nuances précises disponibles dans ta session."},
        {q:"Pour les deux matériaux les plus performants : relevez E, ΔE, ρ, Δρ ; calculez M ; calculez ΔM par propagation d'incertitudes ; que penser des résultats ?", a:["Méthode : M = √E/ρ. Par propagation d'incertitudes (dérivées partielles) : ΔM/M ≈ (1/2)·(ΔE/E) + (Δρ/ρ).","Si les plages [M−ΔM, M+ΔM] des deux matériaux se chevauchent, on ne peut pas affirmer avec certitude qu'un matériau est meilleur que l'autre sur ce seul critère : la décision doit s'appuyer sur un autre critère (prix, environnemental, disponibilité)."], flag:"Valeurs numériques (E, ΔE, ρ, Δρ) à relever dans Granta — je n'y ai pas accès."},
        {q:"Ajoutez le prix économique : Cm en €/kg dans Granta. Quelle expression donne le prix volumique ? Quel matériau devient le plus performant ?", a:["Prix volumique Cv (€/m³) = Cm (€/kg) × ρ (kg/m³).","L'indice de performance économique devient M' = √E / (ρ·Cm), en reprenant le même raisonnement que pour M mais en incluant le coût matière total.","Point pédagogique : un matériau très performant techniquement mais cher (composite avancé) peut devenir moins intéressant une fois le prix intégré, alors qu'un matériau moins performant sur M mais nettement moins cher (bois massif, acier standard) peut redevenir compétitif sur M'."]},
        {q:"Si l'on ajoute un critère environnemental (empreinte carbone de production), quel matériau devient le plus performant ?", a:["Même logique : M'' = √E / (ρ × empreinte carbone par kg).","Le bois (et les matériaux biosourcés en général) a une empreinte carbone de production structurellement bien plus faible que les métaux et la plupart des polymères techniques (moins d'énergie de transformation, carbone biogénique stocké) : c'est typiquement lui qui redevient le plus performant dès qu'on introduit ce critère.","C'est le message central du TD : un même matériau peut être \"optimal\" ou non selon les critères croisés — l'approche multicritère de l'écoconception."]}
      ]
    },
    {
      id:"td-isolant-etuve", eyebrow:"Multi-matériaux · cas d'étude", title:"Isolant thermique d'une étuve (usage cyclique)",
      note:"Démarche et formules entièrement redémontrées ci-dessous à partir de l'énoncé ; aucune donnée externe nécessaire pour la partie modèle.",
      items:[
        {q:"Quelle fonction principale est assurée par l'isolant des parois d'une étuve ?", a:["Limiter le flux de chaleur à travers la paroi, pour maintenir la température de consigne à l'intérieur en consommant le moins d'énergie possible."]},
        {q:"En termes de température admissible par l'isolant, quelle limite vous semble pertinente ?", a:["La température maximale de service de l'isolant doit rester supérieure à la température de consigne de l'étuve (séchage du bois), avec une marge de sécurité : l'isolant ne doit ni se dégrader, ni perdre ses propriétés, ni présenter de risque à cette température."]},
        {q:"Une étuve fonctionne par cycles (montée en température puis maintien). Quel objectif peut-on chercher à minimiser ou maximiser ?", a:["Minimiser l'énergie totale perdue (ou consommée) sur un cycle complet, pas seulement en régime stationnaire — puisque l'étuve n'est pas utilisée en continu."]},
        {q:"En régime stationnaire, quelle caractéristique du matériau définit l'énergie perdue Q1 par conduction ? Pour la minimiser, augmente-t-on ou réduit-on l'épaisseur ?", a:["La conductivité thermique λ (plus elle est faible, moins le flux de conduction est important).","Pour minimiser Q1, il faut AUGMENTER l'épaisseur e (la résistance thermique R = e/λ augmente avec e, donc le flux diminue)."]},
        {q:"Lors de la montée en température, quelle caractéristique définit l'énergie Q2 emmagasinée par l'isolant ? Pour la minimiser, augmente-t-on ou réduit-on l'épaisseur ?", a:["La capacité thermique massique Cp, combinée à la masse de l'isolant (donc à ρ et au volume).","Pour minimiser Q2, il faut RÉDUIRE l'épaisseur e (moins de matière à chauffer = moins d'énergie stockée dans l'isolant)."]},
        {q:"Tracez l'allure de Q1, Q2 et Q=Q1+Q2 en fonction de e. Identifiez Qmin, exprimez e à ce point, puis Qmin. Quel terme ne dépend que du matériau ?", a:["Q1(e) décroît en 1/e (hyperbole) ; Q2(e) croît linéairement avec e (droite) ; Q(e) = Q1+Q2 a donc une forme en \"U\" avec un minimum.","En écrivant Q1 = λ·ΔT·A·t/e et Q2 = ρ·Cp·ΔT·A·e, la dérivée dQ/de = 0 donne : <b>e* = √(λ·t / (ρ·Cp))</b> — on reconnaît la profondeur de pénétration thermique √(a·t), avec a = λ/(ρCp) la diffusivité thermique.","En reportant e* dans Q : <b>Qmin = 2·A·ΔT·√(λ·ρ·Cp·t)</b>.","Le terme qui ne dépend QUE du matériau est √(λ·ρ·Cp) : c'est l'effusivité thermique. C'est elle qu'il faut MINIMISER pour minimiser Qmin."]},
        {q:"Sur un diagramme d'Ashby d'abscisse ρ et d'ordonnée 1/(λ·Cp), la droite d'iso-performance a un coefficient directeur de 1. Quels sont les isolants les plus performants ?", a:["Minimiser √(λρCp) revient à maximiser 1/(λρCp) = [1/(λCp)] / ρ, donc à chercher les points les plus en haut à gauche du graphique (ρ faible ET λ·Cp faible).","Ce sont typiquement les isolants cellulaires légers à faible capacité thermique : laines minérales (verre, roche) et mousses synthétiques basse densité (polystyrène expansé/extrudé), qui combinent très faible densité et λ·Cp faible."]},
        {q:"Où se trouverait un isolant biosourcé dans ce graphique ? Pour le BioFib Trio (chanvre, coton, lin), que peut-on dire de son niveau de performance technique ?", a:["Les isolants biosourcés ont une densité comparable, voire légèrement supérieure (~30-55 kg/m³) aux laines minérales légères (~12-35 kg/m³), et surtout une capacité thermique massique bien plus élevée (~1500-2100 J/kg·K contre ~840-1030 J/kg·K pour laine minérale/PSE).","Sur ce graphique, le BioFib Trio se situerait donc plus bas et plus à droite que les meilleurs isolants minéraux/synthétiques légers : sur CE critère précis (usage cyclique), il est moins performant.","Ce résultat illustre un point important : une forte capacité thermique, souvent présentée comme un atout (inertie, confort d'été en usage continu), devient ici un désavantage car elle correspond à l'énergie perdue à chaque cycle de chauffe. Un matériau \"plus écologique\" n'est pas automatiquement le plus performant techniquement — tout dépend du critère et du type d'usage (cyclique vs continu)."], flag:"Valeurs de Cp/ρ données à titre indicatif (ordres de grandeur usuels) : remplace-les par la fiche technique exacte fournie en cours."}
      ]
    },
    {
      id:"td-bois-beton", eyebrow:"Multi-matériaux · cas d'étude", title:"Assemblage bi-matériaux bois-béton (plancher mixte)",
      note:"Toutes les données numériques de ce TD étaient fournies dans l'énoncé : calcul fait intégralement à partir d'elles. Deux hypothèses restent à confirmer avec ton prof (voir les repères orange ci-dessous).",
      items:[
        {q:"Calculez ΔT et ΔMC entre l'hiver (10°C, 75% HR) et l'été (25°C, 65% HR).", a:["ΔT = 25 − 10 = 15°C (15 K).","Pour ΔMC, il faut convertir l'humidité relative en humidité d'équilibre du bois (MC) via la courbe d'équilibre hygroscopique : à titre indicatif, HR 65% ≈ 12% MC et HR 75% ≈ 15% MC, soit ΔMC ≈ 3 points."], flag:"ΔMC estimé à partir d'une courbe d'équilibre hygroscopique standard — vérifie avec l'abaque exact donné en cours, c'est la seule donnée que l'énoncé ne fournit pas directement."},
        {q:"Calculez la variation de largeur de la dalle béton due à la dilatation thermique (béton seul).", a:["Δl_béton = l × α_béton × ΔT = 1000 mm × 1,05×10⁻⁵/K × 15K ≈ <b>0,16 mm</b>."]},
        {q:"Calculez la variation de largeur de l'ensemble des planches due à la dilatation thermique du bois (bois seul).", a:["Avec le coefficient tangentiel (hypothèse par défaut) : Δl = l × αT × ΔT = 1000 × 4,25×10⁻⁵ × 15 ≈ <b>0,64 mm</b>.","Avec le coefficient radial : 1000 × 3,0×10⁻⁵ × 15 ≈ 0,45 mm."], flag:"Le choix tangentiel/radial dépend de l'orientation du fil dans les planches (débit sur dosse ou sur quartier) — confirme avec ce que ton prof a précisé sur la Figure 1."},
        {q:"Calculez la variation de largeur de l'ensemble des planches due à la dilatation hydrique du bois.", a:["Avec le coefficient tangentiel : Δl = l × βT × ΔMC = 1000 × 0,0037 × 3 ≈ <b>11,1 mm</b>.","Avec le coefficient radial : 1000 × 0,0019 × 3 ≈ 5,7 mm.","Remarque : ce résultat confirme la règle générale vue en cours — le bois est bien plus sensible aux variations d'humidité qu'aux variations de température (ici, la dilatation hydrique domine très largement la dilatation thermique)."]},
        {q:"À partir des deux résultats précédents, quelle est la variation de largeur due à la dilatation hygrothermique totale ?", a:["Tangentiel : 0,64 + 11,1 ≈ <b>11,7 mm</b>.","Radial : 0,45 + 5,7 ≈ <b>6,2 mm</b>."]},
        {q:"Calculez la contrainte normale apparue dans le béton à cause de la dilatation thermique.", a:["En considérant le béton empêché de se dilater librement par sa liaison au bois (hypothèse de blocage total) : σ_béton = E_béton × α_béton × ΔT = 31475 × 1,05×10⁻⁵ × 15 ≈ <b>4,96 N/mm² (MPa)</b>, en compression."], flag:"Hypothèse retenue : blocage total (chaque matériau empêché de se dilater librement). Si ton prof a plutôt vu un modèle de compatibilité des déformations entre les deux matériaux (répartition selon leurs raideurs axiales E×A respectives), dis-le-moi et je refais le calcul avec cette méthode."},
        {q:"Calculez la force résultante.", a:["A_béton = L × h_béton = 6000 × 60 = 360 000 mm².","F_béton = σ_béton × A_béton ≈ 4,96 × 360 000 ≈ <b>1 785 000 N (≈1785 kN)</b>."]},
        {q:"Calculez la contrainte tangentielle que cela entraîne à l'interface bois/béton.", a:["τ = F_béton / (surface d'interface collée) = F_béton / (L × l) = 1 785 000 / (6000×1000) ≈ <b>0,30 N/mm² (MPa)</b>."]},
        {q:"Calculez la contrainte normale apparue dans le bois à cause de la dilatation hygrothermique.", a:["σ_bois = E_bois × ε_bois,hygrothermique = 370 × 0,0117 ≈ <b>4,34 N/mm²</b> (coefficient tangentiel).","Avec le coefficient radial (ε≈0,0062) : σ_bois ≈ 2,28 N/mm²."]},
        {q:"Calculez la force résultante.", a:["A_bois = L × h_bois = 6000 × 125 = 750 000 mm².","F_bois = σ_bois × A_bois ≈ 4,34 × 750 000 ≈ <b>3 257 000 N (≈3257 kN)</b> (tangentiel), ≈1707 kN (radial)."]},
        {q:"Calculez la contrainte tangentielle que cela entraîne à l'interface bois/béton.", a:["τ = F_bois / (L × l) = 3 257 000 / 6 000 000 ≈ <b>0,54 N/mm²</b> (tangentiel), ≈0,28 N/mm² (radial).","Ordre de grandeur cohérent avec les valeurs de dimensionnement de connecteurs bois-béton réels (plage typique 0,1 à 1 MPa selon l'espacement des connecteurs)."]}
      ]
    },

      note:"Les éléments ci-dessous sont des propositions de correction type (besoin, bête à cornes, EME, fonctions, CdCF). Les diagrammes pieuvre sont décrits en texte plutôt que dessinés — à reporter sur un vrai diagramme pour la forme attendue.",

    {
      id:"td-af-table", eyebrow:"Analyse fonctionnelle", title:"Cas complet : table mobile à plateaux rabattables",
      note:"Cas d'étude complet, dans la continuité des objets précédents mais avec deux temporalités à distinguer (en utilisation / au repos) et un second utilisateur implicite à faire émerger.",
      items:[
        {q:"Définissez le besoin associé au système en utilisation.", a:["Permettre à un ou plusieurs utilisateurs de disposer d'une surface de travail/réunion stable en position d'usage, tout en pouvant replier et déplacer facilement la table pour réorganiser l'espace de la salle."]},
        {q:"Représentez l'expression de ce besoin à l'aide d'une bête à cornes.", a:["À qui rend-il service ? Aux utilisateurs de la salle. Sur quoi agit-il ? Sur la possibilité de disposer d'une surface plane de travail. Dans quel but ? Offrir une surface stable et rapidement reconfigurable selon les besoins de la salle."]},

  // -- ids + progress --------------------------------------------------
  SUBJECTS.forEach(function(s){
    s.chapters.forEach(function(c){
      c.cards.forEach(function(card, i){ card.id = s.id + "__" + c.id + "__" + i; });
    });
  });

  var PROGRESS_KEY = "revision_progress_v1";
  function loadProgress(){
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveProgress(p){
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch(e){}
  }
  function markCard(cardId, known){
    var p = loadProgress();
    p[cardId] = known;
    saveProgress(p);
  }
  function chapterMastery(chapter){
    var p = loadProgress();
    var total = chapter.cards.length, known = 0;
    chapter.cards.forEach(function(c){ if (p[c.id]) known++; });
    return total ? Math.round(known / total * 100) : 0;
  }
  function globalStats(){
    var p = loadProgress();
    var total = 0, known = 0;
    SUBJECTS.forEach(function(s){
      s.chapters.forEach(function(c){
        c.cards.forEach(function(card){ total++; if (p[card.id]) known++; });
      });
    });
    return {known: known, total: total, pct: total ? Math.round(known / total * 100) : 0};
  }

  // -- streak (jours consécutifs d'ouverture du carnet) ------------------
  var STREAK_KEY = "revision_streak_v1";
  function dateKey(d){
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function updateStreak(){
    var s;
    try { s = JSON.parse(localStorage.getItem(STREAK_KEY)) || {count: 0, last: null}; }
    catch(e){ s = {count: 0, last: null}; }
    var today = dateKey(new Date());
    if (s.last === today) return s.count;
    var yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    s.count = (s.last === dateKey(yesterday)) ? s.count + 1 : 1;
    s.last = today;
    try { localStorage.setItem(STREAK_KEY, JSON.stringify(s)); } catch(e){}
    return s.count;
  }

  function motivationLine(pct){
    if (pct <= 0) return "C'est le moment de commencer.";
    if (pct < 30) return "Tu démarres, continue comme ça.";
    if (pct < 60) return "Bon rythme, garde le cap.";
    if (pct < 90) return "Solide. Encore un effort avant l'examen.";
    return "Quasiment tout maîtrisé, bravo.";
  }

  // -- helpers -----------------------------------------------------------
  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function esc(s){
    return s.replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function findSubject(id){ return SUBJECTS.filter(function(s){return s.id===id;})[0]; }

  // -- routing (home / subject-<id> only; sessions are in-page state) ---
  var app = document.getElementById("app");
  var session = null; // transient, not routed

  function go(hash){ location.hash = hash; }
  window.addEventListener("hashchange", render);

  function currentRoute(){
    var h = (location.hash || "").replace(/^#/, "");
    var parts = h.split("/");
    if (parts[0].indexOf("subject-") === 0){
      var sid = parts[0].slice("subject-".length);
      if (findSubject(sid)){
        if (parts[1] === "cours"){
          if (parts[2]) return {view:"cours-chapter", id:sid, chapter:parts[2]};
          return {view:"cours", id:sid};
        }
        if (parts[1] === "td"){
          if (parts[2]) return {view:"td-sheet", id:sid, td:parts[2]};
          return {view:"td", id:sid};
        }
        return {view:"subject", id:sid};
      }
    }
    return {view:"home"};
  }

  function render(){
    clearExamTimer();
    session = null;
    var route = currentRoute();
    app.innerHTML = "";
    app.appendChild(topbar(route));
    if (route.view === "subject") app.appendChild(subjectView(findSubject(route.id)));
    else if (route.view === "cours") app.appendChild(coursView(findSubject(route.id)));
    else if (route.view === "cours-chapter") app.appendChild(coursChapterView(findSubject(route.id), route.chapter));
    else if (route.view === "td") app.appendChild(tdView(findSubject(route.id)));
    else if (route.view === "td-sheet") app.appendChild(tdSheetView(findSubject(route.id), route.td));
    else app.appendChild(homeView());
  }

  function topbar(route){
    var inSubject = route.view === "subject" || route.view === "cours" || route.view === "cours-chapter" || route.view === "td" || route.view === "td-sheet";
    var crumb = inSubject
      ? '<a class="crumb" data-go="home">Matières</a><span style="color:var(--fg-muted)"> / </span><span>' + esc(findSubject(route.id).name) + "</span>"
      : '<span>&nbsp;</span>';
    var bar = el(
      '<div class="topbar">' +
        '<div class="brand">' + sealIcon(42) +
          '<div><span class="kicker mono">ESB · Ingénieur bois</span><h1>Carnet de révisions</h1></div>' +
        '</div>' +
        '<div>' + crumb + '</div>' +
      '</div>'
    );
    bar.querySelectorAll("[data-go]").forEach(function(n){
      n.addEventListener("click", function(){ go(n.getAttribute("data-go")); });
    });
    var tabsWrap = el('<div></div>');
    if (inSubject){
      var sid = route.id;
      var tabs = el(
        '<div class="section-tabs">' +
          '<a data-go="subject-' + sid + '" class="section-tab' + (route.view === "subject" ? " active" : "") + '">Réviser</a>' +
          '<a data-go="subject-' + sid + '/cours" class="section-tab tab-cours' + (route.view.indexOf("cours") === 0 ? " active" : "") + '">Cours</a>' +
          '<a data-go="subject-' + sid + '/td" class="section-tab tab-td' + (route.view.indexOf("td") === 0 ? " active" : "") + '">TD</a>' +
        "</div>"
      );
      tabs.querySelectorAll("[data-go]").forEach(function(n){
        n.addEventListener("click", function(){ go(n.getAttribute("data-go")); });
      });
      tabsWrap.appendChild(tabs);
    }
    var frag = el("<div></div>");
    frag.appendChild(bar);
    frag.appendChild(tabsWrap);
    return frag;
  }

  function leafIcon(){
    return '<svg width="22" height="22" viewBox="0 0 28 28" fill="none">' +
      '<path d="M5 22C5 10 15 5 23 5C23 14 18 23 6 23C5.4 23 5 22.6 5 22Z" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<path d="M23 5C18 9 12 14 6 22" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round"/>' +
      "</svg>";
  }

  function sealIcon(size){
    size = size || 44;
    return '<div class="seal" style="width:' + size + 'px;height:' + size + 'px">' + leafIcon() + "</div>";
  }

  function clockIcon(){
    return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none">' +
      '<circle cx="12" cy="12" r="9" stroke="var(--accent-2)" stroke-width="1.6"/>' +
      '<path d="M12 7v5l3.5 2" stroke="var(--accent-2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      "</svg>";
  }

  function streakIcon(){
    return '<div class="seal" style="width:40px;height:40px;flex:none">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none">' +
        '<path d="M12 3C12 7 8 9 8 13.5C8 16.5 9.8 19 12 19C14.2 19 16 16.5 16 13.5C16 12 15.2 11 15.2 11C15.2 13 14 13.5 14 13.5C14.5 10 12 9 12 3Z" stroke="var(--accent-2)" stroke-width="1.5" stroke-linejoin="round"/>' +
      "</svg>" +
    "</div>";
  }

  function homeView(){
    var wrap = el('<div></div>');
    var streak = updateStreak();
    var stats = globalStats();
    var bilan = el(
      '<div class="card bilan">' +
        '<div class="bilan-row">' +
          '<div class="bilan-stat">' + streakIcon() + '<div><span class="bilan-num mono">' + streak + '</span><span class="bilan-label">' + (streak > 1 ? "jours de suite" : "premier jour") + '</span></div></div>' +
          '<div class="bilan-stat"><div><span class="bilan-num mono">' + stats.pct + '%</span><span class="bilan-label">' + stats.known + " / " + stats.total + ' cartes maîtrisées</span></div></div>' +
        '</div>' +
        '<div class="bar"><i style="width:' + stats.pct + '%"></i></div>' +
        '<div class="bilan-msg">' + esc(motivationLine(stats.pct)) + '</div>' +
      '</div>'
    );
    wrap.appendChild(bilan);
    var grid = el('<div class="subjects"></div>');
    SUBJECTS.forEach(function(s){
      var totalCards = s.chapters.reduce(function(n,c){return n+c.cards.length;},0);
      var knownCards = 0;
      var p = loadProgress();
      s.chapters.forEach(function(c){ c.cards.forEach(function(card){ if (p[card.id]) knownCards++; }); });
      var subjectPct = totalCards ? Math.round(knownCards / totalCards * 100) : 0;
      var card = el(
        '<div class="card subject-card" tabindex="0" role="button" data-go="subject-' + s.id + '">' +
          sealIcon(46) +
          "<h3>" + esc(s.name) + "</h3>" +
          '<div class="meta mono">' + s.chapters.length + " chapitres · " + totalCards + " cartes</div>" +
          '<div class="bar" style="margin:0"><i style="width:' + subjectPct + '%"></i></div>' +
        "</div>"
      );
      card.addEventListener("click", function(){ go("subject-" + s.id); });
      card.addEventListener("keydown", function(e){ if (e.key === "Enter") go("subject-" + s.id); });
      grid.appendChild(card);
    });
    grid.appendChild(el('<div class="subject-add">+ d\'autres matières arriveront ici au fil des cours</div>'));
    wrap.appendChild(grid);
    return wrap;
  }

  function subjectView(subject){
    var wrap = el("<div></div>");
    var list = el('<div class="chapters"></div>');
    subject.chapters.forEach(function(ch, chIdx){
      var mastery = chapterMastery(ch);
      var num = (chIdx + 1 < 10 ? "0" : "") + (chIdx + 1);
      var row = el(
        '<div class="chapter-row">' +
          '<div class="chapter-head">' +
            '<div class="chapter-head-left"><span class="stamp mono">' + num + '</span><h3>' + esc(ch.title) + "</h3></div>" +
            '<span class="count mono">' + ch.cards.length + " cartes · " + mastery + "% maîtrisé</span>" +
          "</div>" +
          '<div class="bar"><i style="width:' + mastery + '%"></i></div>' +
          '<div class="mode-row">' +
            '<button class="primary" data-mode="flashcards">Flashcards</button>' +
            '<button data-mode="qcm">QCM</button>' +
            '<button data-mode="written">Question écrite</button>' +
          "</div>" +
        "</div>"
      );
      row.querySelectorAll("[data-mode]").forEach(function(btn){
        btn.addEventListener("click", function(){
          startSession(subject, ch, btn.getAttribute("data-mode"));
        });
      });
      list.appendChild(row);
    });
    wrap.appendChild(list);
    var examCard = el(
      '<div class="card exam-card">' +
        "<h3>" + clockIcon() + "Examen blanc</h3>" +
        "<p>" + EXAM_LENGTH + " questions QCM tirées au hasard dans toutes les matières, en " + Math.round(EXAM_DURATION/60) + " minutes chrono.</p>" +
        '<div><button class="primary" data-start-exam>Lancer l\'examen blanc</button></div>' +
      "</div>"
    );
    examCard.querySelector("[data-start-exam]").addEventListener("click", function(){ startExam(subject); });
    wrap.appendChild(examCard);
    wrap.appendChild(el(
      '<div class="footer-note">' +
        "<span>La progression est enregistrée uniquement dans ce navigateur.</span>" +
        '<button class="ghost" id="reset-btn" style="font-size:12px;padding:5px 10px">Réinitialiser la progression</button>' +
      "</div>"
    ));
    var resetBtn = wrap.querySelector("#reset-btn");
    var confirming = false;
    resetBtn.addEventListener("click", function(){
      if (!confirming){
        confirming = true;
        resetBtn.textContent = "Confirmer la réinitialisation ?";
        resetBtn.classList.add("danger-ghost");
        setTimeout(function(){
          if (confirming){ confirming = false; resetBtn.textContent = "Réinitialiser la progression"; resetBtn.classList.remove("danger-ghost"); }
        }, 4000);
        return;
      }
      var p = loadProgress();
      subject.chapters.forEach(function(c){ c.cards.forEach(function(card){ delete p[card.id]; }); });
      saveProgress(p);
      render();
    });
    return wrap;
  }

  // -- cours & TD --------------------------------------------------------
  function findChapter(subject, chId){ return subject.chapters.filter(function(c){ return c.id === chId; })[0]; }
  function findTD(tdId){ return TD_SHEETS.filter(function(t){ return t.id === tdId; })[0]; }

  function chevronIcon(){
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function coursView(subject){
    var wrap = el("<div></div>");
    var cours = COURS[subject.id] || {};
    var list = el('<div class="link-rows"></div>');
    subject.chapters.forEach(function(ch, chIdx){
      if (!cours[ch.id]) return;
      var num = (chIdx + 1 < 10 ? "0" : "") + (chIdx + 1);
      var row = el(
        '<div class="link-row cours" tabindex="0" role="button">' +
          "<div><span class=\"tag-num\">Chapitre " + num + "</span><h3>" + esc(ch.title) + "</h3></div>" +
          '<span class="chevron">' + chevronIcon() + "</span>" +
        "</div>"
      );
      row.addEventListener("click", function(){ go("subject-" + subject.id + "/cours/" + ch.id); });
      row.addEventListener("keydown", function(e){ if (e.key === "Enter") go("subject-" + subject.id + "/cours/" + ch.id); });
      list.appendChild(row);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function coursChapterView(subject, chapterId){
    var wrap = el("<div></div>");
    var ch = findChapter(subject, chapterId);
    var blocks = (COURS[subject.id] || {})[chapterId] || [];
    var back = el('<a class="detail-back">‹ Retour au cours</a>');
    back.addEventListener("click", function(){ go("subject-" + subject.id + "/cours"); });
    wrap.appendChild(back);
    wrap.appendChild(el(
      '<div class="detail-head cours"><span class="eyebrow mono">Cours · synthèse</span><h2>' + esc(ch.title) + "</h2></div>"
    ));
    blocks.forEach(function(block){
      var b = el('<div class="cours-block"><h4>' + esc(block.h) + "</h4><ul></ul></div>");
      var ul = b.querySelector("ul");
      block.items.forEach(function(item){
        var li = document.createElement("li");
        li.innerHTML = item;
        ul.appendChild(li);
      });
      wrap.appendChild(b);
    });
    return wrap;
  }

  function tdView(subject){
    var wrap = el("<div></div>");
    wrap.appendChild(el('<div class="td-note">Corrections rédigées par Claude à partir des énoncés de TD. Les méthodes et formules sont fiables ; compare les résultats avec ce que ton prof a montré en séance, surtout là où un repère orange signale une hypothèse.</div>'));
    var list = el('<div class="link-rows"></div>');
    TD_SHEETS.forEach(function(td){
      var row = el(
        '<div class="link-row td" tabindex="0" role="button">' +
          "<div><span class=\"tag-num\">" + esc(td.eyebrow) + "</span><h3>" + esc(td.title) + "</h3>" + '<div class="meta mono">' + td.items.length + " questions</div></div>" +
          '<span class="chevron">' + chevronIcon() + "</span>" +
        "</div>"
      );
      row.addEventListener("click", function(){ go("subject-" + subject.id + "/td/" + td.id); });
      row.addEventListener("keydown", function(e){ if (e.key === "Enter") go("subject-" + subject.id + "/td/" + td.id); });
      list.appendChild(row);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function tdSheetView(subject, tdId){
    var wrap = el("<div></div>");
    var td = findTD(tdId);
    var back = el('<a class="detail-back">‹ Retour aux TD</a>');
    back.addEventListener("click", function(){ go("subject-" + subject.id + "/td"); });
    wrap.appendChild(back);
    wrap.appendChild(el(
      '<div class="detail-head td"><span class="eyebrow mono">' + esc(td.eyebrow) + "</span><h2>" + esc(td.title) + "</h2></div>"
    ));
    if (td.note) wrap.appendChild(el('<div class="td-note">' + esc(td.note) + "</div>"));
    var qa = el('<div class="td-qa"></div>');
    td.items.forEach(function(item, i){
      var itemEl = el(
        '<div class="td-item">' +
          '<div class="q"><span class="qnum mono">' + (i + 1) + '</span><span class="qtext">' + esc(item.q) + "</span></div>" +
          '<div class="atext"></div>' +
          (item.flag ? '<span class="flag">⚠ ' + esc(item.flag) + "</span>" : "") +
        "</div>"
      );
      var atext = itemEl.querySelector(".atext");
      item.a.forEach(function(p){
        var pEl = document.createElement("p");
        pEl.innerHTML = p;
        atext.appendChild(pEl);
      });
      qa.appendChild(itemEl);
    });
    wrap.appendChild(qa);
    return wrap;
  }

  // -- session runner ------------------------------------------------
  var EXAM_LENGTH = 20;
  var EXAM_DURATION = 15 * 60;
  var examTimerId = null;

  function clearExamTimer(){
    if (examTimerId){ clearInterval(examTimerId); examTimerId = null; }
  }
  function formatTime(s){
    var m = Math.floor(s / 60), ss = s % 60;
    return m + ":" + (ss < 10 ? "0" : "") + ss;
  }
  function startExamTimer(){
    clearExamTimer();
    examTimerId = setInterval(function(){
      if (!session || !session.isExam){ clearExamTimer(); return; }
      session.timeLeft--;
      if (session.timeLeft <= 0){
        session.timeLeft = 0;
        clearExamTimer();
        session.pos = session.order.length;
        renderSession();
        return;
      }
      var elTimer = document.getElementById("exam-timer");
      if (elTimer){
        elTimer.textContent = formatTime(session.timeLeft);
        elTimer.classList.toggle("urgent", session.timeLeft <= 60);
      }
    }, 1000);
  }

  function startSession(subject, chapter, mode){
    clearExamTimer();
    session = {
      subject: subject, chapter: chapter, mode: mode, isExam: false,
      order: shuffle(chapter.cards.map(function(_,i){return i;})),
      pos: 0, correct: 0, done: false
    };
    renderSession();
  }

  function startExam(subject){
    var pool = [];
    subject.chapters.forEach(function(ch){
      ch.cards.forEach(function(c){ c.chapterTitle = ch.title; pool.push(c); });
    });
    pool = shuffle(pool);
    session = {
      subject: subject, chapter: null, mode: "qcm", isExam: true,
      order: pool.slice(0, Math.min(EXAM_LENGTH, pool.length)),
      pos: 0, correct: 0, done: false,
      results: {}, timeLeft: EXAM_DURATION
    };
    startExamTimer();
    renderSession();
  }

  function currentCard(){
    var item = session.order[session.pos];
    return session.isExam ? item : session.chapter.cards[item];
  }

  function quitSession(){ clearExamTimer(); render(); }

  function renderSession(){
    app.innerHTML = "";
    app.appendChild(topbar({view:"subject", id: session.subject.id}));
    if (session.pos >= session.order.length){
      clearExamTimer();
      app.appendChild(recapView());
      return;
    }
    var card = currentCard();
    var top = el(
      '<div class="session-top">' +
        '<span class="progress-pill mono">' + (session.pos+1) + " / " + session.order.length + "</span>" +
        (session.isExam ? '<span id="exam-timer" class="progress-pill mono' + (session.timeLeft <= 60 ? " urgent" : "") + '">' + formatTime(session.timeLeft) + "</span>" : "") +
        '<a class="quit" data-quit>Quitter la session</a>' +
      "</div>"
    );
    top.querySelector("[data-quit]").addEventListener("click", quitSession);

    var stageContent;
    if (session.mode === "flashcards") stageContent = flashcardStage(card);
    else if (session.mode === "qcm") stageContent = qcmStage(card);
    else stageContent = writtenStage(card);

    var box = el('<div class="session"></div>');
    box.appendChild(top);
    var stage = el('<div class="stage"></div>');
    stage.appendChild(stageContent);
    box.appendChild(stage);
    app.appendChild(box);
  }

  function nextCard(){ session.pos++; renderSession(); }

  function flashcardStage(card){
    var wrap = el(
      '<div class="flash">' +
        '<div class="flash-inner">' +
          '<div class="flash-face front"><span class="tag">Question</span>' + esc(card.q) + "</div>" +
          '<div class="flash-face back"><span class="tag">Réponse</span>' + esc(card.a) + "</div>" +
        "</div>" +
      "</div>"
    );
    var outer = el('<div style="display:flex;flex-direction:column;align-items:center;gap:18px;width:100%"></div>');
    outer.appendChild(wrap);
    var actions = el(
      '<div class="flash-actions" hidden>' +
        '<button data-know="0">À revoir</button>' +
        '<button class="primary" data-know="1">Je savais</button>' +
      "</div>"
    );
    wrap.addEventListener("click", function(){
      wrap.classList.toggle("flipped");
      if (wrap.classList.contains("flipped")) actions.hidden = false;
    });
    actions.querySelectorAll("[data-know]").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        markCard(card.id, btn.getAttribute("data-know") === "1");
        nextCard();
      });
    });
    outer.appendChild(actions);
    return outer;
  }

  function qcmStage(card){
    var options = shuffle([card.a].concat(card.d));
    var wrap = el(
      '<div class="qcm">' +
        '<div class="q">' + esc(card.q) + "</div>" +
        '<div class="opts"></div>' +
      "</div>"
    );
    var opts = wrap.querySelector(".opts");
    var answered = false;
    options.forEach(function(opt){
      var b = el('<button class="opt">' + esc(opt) + "</button>");
      b.addEventListener("click", function(){
        if (answered) return;
        answered = true;
        var isCorrect = opt === card.a;
        b.classList.add(isCorrect ? "correct" : "wrong");
        if (!isCorrect){
          opts.querySelectorAll(".opt").forEach(function(o){
            if (o.textContent === card.a) o.classList.add("correct");
          });
        }
        opts.querySelectorAll(".opt").forEach(function(o){ o.disabled = true; });
        markCard(card.id, isCorrect);
        if (session.isExam) session.results[card.id] = isCorrect;
        if (card.w){
          wrap.appendChild(el('<div class="explain"><div class="label">Pourquoi</div>' + esc(card.w) + "</div>"));
        }
        var nextBtn = el('<div class="session-nav" style="margin-top:14px"><button class="primary">Suivant</button></div>');
        nextBtn.querySelector("button").addEventListener("click", nextCard);
        wrap.appendChild(nextBtn);
      });
      opts.appendChild(b);
    });
    return wrap;
  }

  function writtenStage(card){
    var wrap = el(
      '<div class="written">' +
        '<div class="q">' + esc(card.q) + "</div>" +
        '<textarea placeholder="Écris ta réponse ici…" autofocus></textarea>' +
        '<div class="session-nav"><button class="primary" data-check>Vérifier</button></div>' +
      "</div>"
    );
    wrap.querySelector("[data-check]").addEventListener("click", function(){
      var answer = wrap.querySelector("textarea").value.trim();
      var compare = el(
        '<div class="compare">' +
          '<div class="block you"><div class="label">Ta réponse</div>' + (answer ? esc(answer) : "<em>(vide)</em>") + "</div>" +
          '<div class="block ref"><div class="label">Réponse attendue</div>' + esc(card.a) + "</div>" +
          (card.w ? '<div class="explain"><div class="label">Pourquoi</div>' + esc(card.w) + "</div>" : "") +
          '<div class="grade-row">' +
            "<span style=\"align-self:center;color:var(--fg-muted);font-size:13px\">C'était juste ?</span>" +
            '<button data-grade="0">Non</button>' +
            '<button class="primary" data-grade="1">Oui</button>' +
          "</div>" +
        "</div>"
      );
      compare.querySelectorAll("[data-grade]").forEach(function(btn){
        btn.addEventListener("click", function(){
          markCard(card.id, btn.getAttribute("data-grade") === "1");
          nextCard();
        });
      });
      wrap.querySelector("textarea").setAttribute("disabled","");
      wrap.querySelector("[data-check]").closest(".session-nav").remove();
      wrap.appendChild(compare);
    });
    return wrap;
  }

  function recapView(){
    if (session.isExam) return examRecapView();
    var p = loadProgress();
    var scored = session.chapter.cards.filter(function(c){ return session.order.map(function(i){return session.chapter.cards[i].id;}).indexOf(c.id) !== -1; });
    var known = scored.filter(function(c){ return p[c.id]; }).length;
    var wrap = el(
      '<div class="recap">' +
        '<h3>Session terminée</h3>' +
        '<div class="score mono">' + known + " / " + scored.length + "</div>" +
        '<div style="color:var(--fg-muted)">' + esc(session.chapter.title) + "</div>" +
        '<div class="session-nav" style="margin-top:8px">' +
          '<button data-again>Refaire</button>' +
          '<button class="primary" data-back>Retour à la matière</button>' +
        "</div>" +
      "</div>"
    );
    wrap.querySelector("[data-again]").addEventListener("click", function(){
      startSession(session.subject, session.chapter, session.mode);
    });
    wrap.querySelector("[data-back]").addEventListener("click", quitSession);
    return wrap;
  }

  function examRecapView(){
    var results = session.results;
    var total = session.order.length;
    var correctCount = 0;
    var byChapter = {};
    session.order.forEach(function(c){
      if (!byChapter[c.chapterTitle]) byChapter[c.chapterTitle] = {correct:0, total:0};
      byChapter[c.chapterTitle].total++;
      if (results[c.id]){ byChapter[c.chapterTitle].correct++; correctCount++; }
    });
    var pct = total ? Math.round(correctCount / total * 100) : 0;
    var wrap = el(
      '<div class="recap">' +
        '<h3>Examen blanc terminé</h3>' +
        '<div class="score mono">' + correctCount + " / " + total + "</div>" +
        '<div style="color:var(--fg-muted)">' + pct + "% de bonnes réponses" + (session.timeLeft <= 0 ? " · temps écoulé" : "") + "</div>" +
      "</div>"
    );
    var table = el('<div class="exam-breakdown"></div>');
    Object.keys(byChapter).forEach(function(title){
      var r = byChapter[title];
      table.appendChild(el('<div class="exam-row"><span>' + esc(title) + '</span><span class="mono">' + r.correct + "/" + r.total + "</span></div>"));
    });
    wrap.appendChild(table);
    var nav = el(
      '<div class="session-nav" style="margin-top:14px">' +
        '<button data-again>Refaire un examen blanc</button>' +
        '<button class="primary" data-back>Retour à la matière</button>' +
      "</div>"
    );
    nav.querySelector("[data-again]").addEventListener("click", function(){ startExam(session.subject); });
    nav.querySelector("[data-back]").addEventListener("click", quitSession);
    wrap.appendChild(nav);
    return wrap;
  }

  render();

  // -- PWA : enregistre le service worker (copie locale + hors-ligne) ---
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function (err) {
        console.warn("Service worker non enregistré :", err);
      });
    });
  }
})();
</script>
