<style>
/* layout: accueil en grille de matières -> page matière en liste de chapitres -> session plein écran par mode */

button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)}

.flash{width:100%;max-width:520px;aspect-ratio:3/2;perspective:1200px;cursor:pointer}

.flash-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:19px}

.flash-face .tag{position:absolute;top:14px;left:16px;color:var(--accent-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}

.compare{display:flex;flex-direction:column;gap:10px}

.compare .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-muted);margin-bottom:4px}
.explain{border-radius:12px;padding:12px 14px;border:1px solid var(--accent);background:color-mix(in srgb, var(--accent) 10%, var(--surface));font-size:14px;line-height:1.5}
.explain .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px;font-weight:600}

.exam-card h3{font-size:17px;display:flex;align-items:center;gap:8px}

<div id="app"></div>

<script>
(function(){
  "use strict";

  var SUBJECTS = [
    {
      id: "eco",
      name: "Écoconception",
      note: "12 chapitres",
      chapters: [
        {
          id: "fond",
          title: "Fondamentaux de l'écoconception",
          cards: [
            {q:"La norme ISO 14062 cadre l'écoconception. Que définit-elle précisément ?", a:"Un vocabulaire commun et des principes pour intégrer les aspects environnementaux dès la conception, afin de réduire les impacts sur l'ensemble du cycle de vie du produit.", d:["Des seuils chiffrés d'émissions de CO2 à ne pas dépasser, imposés à chaque catégorie de produit industriel.","Une procédure de certification obligatoire, délivrée par un organisme accrédité avant toute mise sur le marché.","Une méthode de calcul détaillée permettant de réaliser une analyse du cycle de vie complète et comparable entre entreprises."], w:"L'ISO 14062 est un cadre conceptuel et un vocabulaire commun, pas un seuil réglementaire, une certification ou une méthode de calcul : ces outils-là existent, mais relèvent d'autres démarches (ACV normée, écolabels, réglementation)."},
            {q:"Quelle est la différence entre écoconception et éco-innovation ?", a:"L'écoconception vise à réduire les impacts d'un produit à fonction équivalente ; l'éco-innovation peut remettre en cause la fonction ou le modèle économique (ex : vendre un usage plutôt qu'un produit).", d:["L'écoconception ne modifie que l'apparence extérieure du produit ; l'éco-innovation ne modifie que son procédé de fabrication.","L'écoconception s'applique à un produit déjà commercialisé ; l'éco-innovation ne s'applique qu'à un produit encore au stade de prototype.","L'écoconception vise d'abord à réduire les coûts de production ; l'éco-innovation vise uniquement à réduire les impacts environnementaux, sans lien avec les coûts."], w:"La nuance clé : l'écoconception optimise ce qui existe déjà à fonction égale, alors que l'éco-innovation peut changer le modèle (louer un usage au lieu de vendre un produit, par exemple) — la différence porte sur la fonction et le modèle, pas sur l'apparence, le stade du projet ou les coûts."},
            {q:"Pourquoi l'écoconception est-elle une approche \"multicritère\" et \"multi-étapes\" ?", a:"Parce qu'elle prend en compte plusieurs indicateurs d'impact à la fois et toutes les étapes du cycle de vie, pour éviter un simple déplacement de la pollution.", d:["Parce qu'elle doit être validée successivement par plusieurs services internes de l'entreprise avant tout lancement en production.","Parce qu'elle nécessite l'accord de plusieurs organismes de certification environnementale avant la mise sur le marché du produit.","Parce qu'elle s'applique en parallèle à plusieurs gammes de produits, afin de mutualiser le coût de l'étude environnementale."], w:"Multicritère et multi-étapes renvoient aux indicateurs d'impact et aux phases du cycle de vie du produit lui-même, pas à des étapes de validation administrative ou organisationnelle de l'entreprise : se concentrer sur un seul critère ou une seule étape risque de faire gagner d'un côté et perdre de l'autre."},
            {q:"Qu'est-ce qu'un \"transfert de pollution\" que l'écoconception cherche à éviter ?", a:"Réduire un impact sur une étape ou un critère environnemental en en aggravant un autre ailleurs (ex : réduire le poids d'un produit mais augmenter sa toxicité).", d:["Le fait de transporter les déchets industriels d'un pays à un autre pour qu'ils y soient traités à moindre coût.","Le remplacement d'un fournisseur de matière première par un autre proposant un meilleur prix, sans lien avec l'impact environnemental.","L'obtention d'un nouvel écolabel sur un produit dont la conception n'a pourtant pas changé entre-temps."], w:"C'est l'inverse de l'objectif de l'écoconception : améliorer un point sans vérifier les autres peut aggraver le bilan global du produit. Le transport de déchets, un changement de fournisseur ou l'obtention d'un label décrivent d'autres situations, sans ce mécanisme précis de report d'impact."},
            {q:"Un bureau d'étude affirme avoir \"écoconçu\" un produit simplement en réduisant sa masse de 20%. Pourquoi cette affirmation est-elle incomplète au sens strict de l'écoconception ?", a:"Parce qu'une approche multicritère et multi-étapes impose de vérifier qu'aucun autre impact (toxicité, consommation en usage, recyclabilité...) n'a été aggravé ailleurs par cette réduction de masse, sous peine de transfert de pollution.", d:["Parce que la masse d'un produit n'a jamais d'influence sur son impact environnemental global.", "Parce que seule une réduction de masse validée par un écolabel officiel peut être qualifiée d'écoconception.", "Parce que l'écoconception ne concerne que les impacts mesurés lors de la phase de fabrication, jamais la masse du produit fini."], w:"C'est l'application directe de la logique multicritère/multi-étapes et du risque de transfert de pollution vus plus haut : un seul chiffre qui s'améliore ne prouve rien sans vérifier le reste du cycle de vie et les autres indicateurs."}
          ]
        },
        {
          id: "acv",
          title: "Analyse du Cycle de Vie (ACV)",
          cards: [
            {q:"Quelles normes encadrent la méthodologie de l'Analyse du Cycle de Vie ?", a:"ISO 14040 (principes et cadre) et ISO 14044 (exigences et lignes directrices).", d:["ISO 14001 (système de management environnemental) et ISO 14006 (lignes directrices d'intégration de l'écoconception).","ISO 9001 (management de la qualité) et ISO 14021 (auto-déclarations environnementales).","ISO 50001 (système de management de l'énergie) et ISO 14025 (déclarations environnementales de type III)."], w:"14040 pose les principes généraux, 14044 détaille les exigences méthodologiques précises : les deux normes sont indissociables en pratique. Les autres paires citées existent bien mais encadrent d'autres démarches (management environnemental, qualité, énergie, auto-déclarations)."},
            {q:"À quoi sert l'unité fonctionnelle dans une ACV ?", a:"Elle quantifie la fonction rendue par le produit étudié, pour comparer équitablement des produits différents qui rendent le même service.", d:["Elle fixe la durée de vie minimale que le produit doit garantir pour que les résultats de l'ACV restent valables dans le temps.","Elle désigne la part du produit recyclable en fin de vie, utilisée ensuite pour calculer le taux de valorisation final.","Elle correspond à la masse totale de matière première consommée pour fabriquer une unité du produit fini."], w:"Sans unité fonctionnelle commune, comparer deux produits n'a pas de sens (ex : comparer 1 kg de matériau à 1 objet fini fausse le résultat). Durée de vie, taux de recyclabilité et masse de matière sont des données qui entrent dans l'ACV, mais aucune ne remplace l'unité fonctionnelle elle-même."},
            {q:"Qu'est-ce qu'une évaluation environnementale \"simplifiée\" par rapport à une ACV complète ?", a:"Un outil plus rapide et moins coûteux (check-list, ESQCV, logiciel simplifié) utilisé en amont de la conception pour orienter les choix, sans la rigueur d'une ACV normée.", d:["Une ACV réalisée uniquement sur la phase de fabrication, en laissant de côté l'usage et la fin de vie.","Une ACV qui ne prend en compte qu'un seul indicateur d'impact, généralement le changement climatique.","Une certification officielle délivrée par un organisme accrédité, attestant qu'une ACV complète a bien été réalisée."], w:"Elle sert à orienter des choix rapidement en conception, pas à publier un résultat officiel : la rigueur normée reste réservée à l'ACV complète. Se limiter à une étape, à un seul indicateur ou obtenir une certification sont d'autres situations, pas la définition de la simplification."},
            {q:"Citez au moins deux catégories d'indicateurs d'impact utilisées en ACV.", a:"Le changement climatique (GWP, en kg eq. CO2), l'épuisement des ressources abiotiques, l'acidification, l'eutrophisation ou l'écotoxicité.", d:["Le chiffre d'affaires généré par le produit et sa part de marché face à la concurrence.","La note de satisfaction client et le taux de retour du produit en service après-vente.","Le temps de montage en atelier et le coût de main-d'œuvre associé à la fabrication."], w:"Le GWP (climat) est le plus connu, mais une vraie ACV croise plusieurs indicateurs environnementaux pour éviter de n'optimiser qu'un seul aspect. Chiffre d'affaires, satisfaction client ou coût de main-d'œuvre sont des indicateurs économiques ou commerciaux, pas environnementaux."},
            {q:"Une entreprise compare deux emballages évalués avec la même méthode d'ACV : l'un pèse 50g et transporte 1 unité de produit, l'autre pèse 80g et en transporte 3. Pourquoi ne peut-on pas conclure que le premier est \"meilleur\" juste en comparant leurs masses ?", a:"Parce que la comparaison doit se faire sur la même unité fonctionnelle (ex : la quantité d'emballage nécessaire pour transporter 1 unité de produit), et qu'à cette unité, l'emballage le plus léger au total n'est pas forcément celui qui consomme le moins de matière par produit transporté.", d:["Parce que la masse d'un emballage n'a jamais d'influence sur les résultats d'une ACV.","Parce qu'il faut toujours privilégier l'emballage le plus léger, quelle que soit la quantité de produit transportée.","Parce que seul le coût d'achat de l'emballage permet de trancher entre deux solutions d'emballage."], w:"C'est une mise en situation directe de l'unité fonctionnelle : ramener les deux emballages à \"la quantité de matière utilisée pour transporter 1 unité de produit\" peut inverser le classement obtenu en comparant simplement les masses brutes."}
          ]
        },
        {
          id: "ecolabels",
          title: "Écolabels et exemples",
          cards: [
            {q:"Qu'est-ce qu'un écolabel officiel de type I (Ecolabel européen, NF Environnement) par rapport à une simple allégation du fabricant ?", a:"Il est attribué après vérification par un organisme tiers indépendant, sur des critères multicritères couvrant tout le cycle de vie, contrairement à une autodéclaration non contrôlée.", d:["Il garantit uniquement que le produit a été fabriqué sur le territoire français, sans engagement sur ses impacts réels.","Il garantit que le produit est totalement biodégradable en fin de vie, quel que soit le milieu dans lequel il est abandonné.","Il dispense l'entreprise de réaliser une analyse du cycle de vie, puisque le label en tient déjà lieu."], w:"La vérification par un tiers indépendant, sur plusieurs critères et sur tout le cycle de vie, est ce qui distingue un vrai écolabel d'une simple autodéclaration marketing : il ne porte ni sur l'origine géographique, ni sur la biodégradabilité seule, et ne remplace pas une ACV."},
            {q:"Pourquoi la chaise Aeron (Herman Miller) est-elle souvent citée en exemple en écoconception ?", a:"Parce qu'elle a été conçue dès l'origine pour être démontable et recyclable en fin de vie, tout en conservant ses performances d'usage.", d:["Parce qu'elle est fabriquée intégralement à partir de matériaux biosourcés, sans aucun composant synthétique.","Parce qu'elle a été le tout premier produit industriel à obtenir la certification Ecolabel européen.","Parce qu'elle a été conçue pour ne nécessiter aucune maintenance pendant toute sa durée d'usage."], w:"L'exemple illustre qu'écoconception ne veut pas dire sacrifier la performance : démontabilité et qualité d'usage ont été pensées ensemble dès le départ, pas le choix d'une matière biosourcée, une certification ou une absence de maintenance."},
            {q:"Un fabricant écrit \"100% naturel\" sur l'emballage d'un produit, sans faire appel à aucun organisme de vérification. Pourquoi cette mention n'a-t-elle pas la même valeur qu'un écolabel officiel de type I ?", a:"Parce qu'il s'agit d'une autodéclaration non contrôlée par un tiers indépendant, alors qu'un écolabel officiel exige une vérification multicritère sur l'ensemble du cycle de vie avant d'être attribué.", d:["Parce que la mention \"100% naturel\" est automatiquement fausse dès qu'elle n'est pas accompagnée d'un prix réduit.", "Parce que seuls les écolabels officiels ont le droit d'utiliser un adjectif qualifiant l'origine d'un matériau.", "Parce qu'un écolabel officiel se limite toujours à un seul critère, alors qu'une autodéclaration peut en couvrir plusieurs."], w:"C'est l'application directe de la distinction vue plus haut entre écolabel officiel et allégation du fabricant : l'absence de vérification par un tiers indépendant est le point qui fragilise toute autodéclaration, quel que soit son contenu."}
          ]
        },
        {
          id: "rep",
          title: "Filière REP et fin de vie (Valdelia)",
          cards: [
            {q:"Que signifie REP et quel principe fondamental porte-t-elle ?", a:"Responsabilité Élargie du Producteur : les producteurs doivent financer ou organiser la gestion des déchets issus de leurs produits en fin de vie (principe pollueur-payeur).", d:["Réglementation Européenne des Plastiques : un règlement qui limite progressivement l'usage du plastique à usage unique dans l'Union européenne.","Recyclage et Protection : un label de certification volontaire attribué aux entreprises qui s'engagent sur le recyclage.","Redevance pour l'Élimination des Polluants : une taxe prélevée sur les émissions industrielles, indépendante du produit vendu."], w:"Le principe pollueur-payeur transfère la charge de la fin de vie vers celui qui met le produit sur le marché, pas vers la collectivité : un règlement sur le plastique, un label volontaire ou une taxe sur les émissions sont d'autres dispositifs, sans ce principe de responsabilité du producteur."},
            {q:"Quelle loi française a renforcé les filières REP (dont celle du mobilier), avec le tri 9 flux et le Triman ?", a:"La loi AGEC (Anti-Gaspillage pour une Économie Circulaire), du 10 février 2020.", d:["La loi NOTRe, qui réorganise les compétences des collectivités territoriales sans viser spécifiquement les filières REP.","La loi de Transition Énergétique pour la Croissance Verte (LTECV), centrée sur la sobriété énergétique plutôt que sur les déchets.","La directive cadre européenne relative aux déchets, qui fixe un cadre général mais sans créer le tri 9 flux ni le Triman en France."], w:"AGEC est la loi française de référence pour l'économie circulaire, avec des mesures précises (tri 9 flux, Triman) que les autres textes cités n'introduisent pas, même s'ils concernent aussi l'environnement ou les collectivités."},
            {q:"Qu'est-ce que Valdelia ?", a:"Un éco-organisme à but non lucratif, agréé pour organiser la collecte, le réemploi, la réparation et le recyclage des déchets d'éléments d'ameublement (DEA) et des produits/matériaux de construction du bâtiment (PMCB).", d:["Une entreprise privée de recyclage cotée en bourse, qui facture librement ses prestations de collecte aux industriels.","Un label volontaire de certification bois, comparable à FSC/PEFC, attribué aux produits issus de forêts gérées durablement.","Une administration publique rattachée au ministère de l'Écologie, financée directement par le budget de l'État."], w:"Son caractère \"à but non lucratif\" le distingue d'une entreprise classique : il existe pour organiser la filière, pas pour en tirer un profit, et ce n'est ni un label de certification ni une administration publique."},
            {q:"Comment est financé Valdelia et pourquoi n'en tire-t-il aucun profit ?", a:"Par l'éco-contribution versée par les metteurs en marché, répercutée sur le prix de vente, et par les recettes matières ; en tant qu'organisme à but non lucratif, ses recettes doivent seulement équilibrer ses charges.", d:["Par une subvention annuelle de l'État, versée indépendamment du volume de déchets réellement traités chaque année.","Par la revente à des tiers des données commerciales de ses adhérents, en complément de ses autres recettes.","Par une taxe prélevée directement sur les salaires des salariés travaillant dans les ateliers de menuiserie."], w:"L'éco-contribution, payée par le metteur en marché puis répercutée sur le client final, est le mécanisme concret du principe pollueur-payeur : ni subvention publique indépendante du volume traité, ni revente de données, ni taxe sur les salaires."},
            {q:"Quelles sont les 4 options de valorisation (\"secondes vies\") mises en avant par Valdelia pour le mobilier usagé ?", a:"L'occasion (revente), le réemploi/réparation, l'upcycling (mobilier design à partir de matériaux de réemploi) et le recyclage matières.", d:["L'export vers d'autres pays, le stockage longue durée, l'incinération et l'enfouissement en centre de déchets.","La location longue durée, le don à des associations, la destruction contrôlée et la compensation carbone.","La réparation sous garantie, la garantie étendue, le service après-vente et le remboursement intégral."], w:"L'ordre va du moins transformé (occasion) au plus transformé (recyclage matière) : toujours privilégier la solution la plus haute dans cette hiérarchie, plutôt que l'export, le stockage, l'incinération ou des dispositifs commerciaux classiques."},
            {q:"D'après les chiffres clés 2024 de Valdelia, quel est approximativement le taux de recyclage et réutilisation de la filière DEA ?", a:"Environ 80 % (80,3 %), pour un taux de valorisation globale proche de 96,5 %.", d:["Environ 20 %, la grande majorité du mobilier usagé étant encore envoyée en enfouissement faute de filière organisée.","Environ 50 %, un taux comparable à celui observé pour la plupart des autres filières REP françaises.","100 %, la filière DEA ne générant, d'après Valdelia, aucun déchet ultime non valorisé."], w:"Un chiffre à retenir pour situer la performance réelle de la filière mobilier : ni une filière encore balbutiante (20%), ni une performance moyenne (50%), ni une valorisation totale parfaite (100%)."},
            {q:"Quels matériaux issus du mobilier professionnel en fin de vie sont effectivement recyclés en France, selon Valdelia ?", a:"Le bois et les panneaux à base de bois (hors MDF), ainsi que les métaux ferreux et non ferreux ; les autres matériaux (textiles, mousses, plastiques) sont surtout valorisés énergétiquement.", d:["Uniquement les métaux ; le bois est quant à lui systématiquement envoyé en incinération sans tri préalable.","Le verre et les matières minérales en priorité, le bois et les métaux n'étant que marginalement concernés par le recyclage matière.","Tous les matériaux sans distinction, y compris les panneaux MDF et les éléments en PVC, qui se recyclent aussi facilement que le bois massif."], w:"Le recyclage matière fonctionne surtout sur des matériaux \"propres\" et séparables (bois hors MDF, métaux) : le mélange de matières (MDF, PVC) complique toujours le tri, contrairement à ce que suggèrent les autres propositions."},
            {q:"Pourquoi les panneaux de fibres (MDF) et le PVC sont-ils considérés comme des \"perturbateurs du recyclage\" du mobilier ?", a:"Parce qu'ils compliquent ou empêchent le recyclage matière des éléments d'ameublement (fibres non séparables pour le MDF, composant plastique difficile à valoriser pour le PVC), contrairement au bois massif ou au métal.", d:["Parce que leur vente est interdite en France depuis l'entrée en vigueur de la loi AGEC en 2020.","Parce qu'ils sont classés réglementairement comme déchets dangereux, au même titre que l'amiante.","Parce qu'ils ne peuvent faire l'objet d'aucune valorisation, y compris énergétique, contrairement aux autres matériaux du mobilier."], w:"Ce sont des exemples concrets de mauvais choix d'écoconception en fin de vie : le problème est la difficulté de séparation/recyclage matière, pas une interdiction de vente, un classement en déchet dangereux ou une absence totale de valorisation."},
            {q:"Quelle bonne pratique d'écoconception Valdelia recommande-t-elle pour faciliter le recyclage du mobilier en fin de vie ?", a:"Favoriser les éléments mono-matériaux (bois ou métal), limiter le nombre de matériaux et de visseries, et concevoir des mobiliers empilables, pliables ou facilement démontables.", d:["Maximiser le nombre de finitions et de revêtements différents, pour élargir le choix esthétique proposé au client final.","Coller systématiquement les éléments entre eux, afin de garantir une meilleure solidité du meuble sur toute sa durée de vie.","Privilégier des matières inertes minérales comme le verre ou le marbre, plus stables chimiquement que le bois ou le métal."], w:"C'est l'application directe, côté conception, de ce que la filière de recyclage demande en aval : moins de mélange de matières et plus de démontabilité, à l'opposé de finitions multiples, du collage systématique ou du choix de matières minérales."},
            {q:"Un fabricant conçoit un caisson de rangement en collant ensemble un panneau MDF, un placage plastique et des pièces métalliques, pour un coût de production minimal. En quoi ce choix va-t-il à l'encontre des recommandations de Valdelia pour la fin de vie du produit ?", a:"Il cumule deux \"perturbateurs du recyclage\" (MDF et plastique) et un assemblage collé entre plusieurs matières différentes, alors que Valdelia recommande des éléments mono-matériaux, peu nombreux et démontables pour que le mobilier puisse être recyclé ou réemployé en fin de vie.", d:["Il n'y a pas de problème, puisque le coût de production minimal est le seul critère retenu par Valdelia pour évaluer l'écoconception d'un meuble.","Le problème vient uniquement du choix du métal, qui reste le seul matériau réellement perturbateur pour le recyclage du mobilier.","Le problème disparaît dès que le fabricant obtient un écolabel officiel sur ce produit, quelle que soit sa composition matière."], w:"C'est la synthèse des deux cartes précédentes (perturbateurs du recyclage + bonne pratique mono-matériau) appliquée à un cas concret : minimiser le coût de production à court terme peut créer un déchet non recyclable à long terme."}
          ]
        },
        {
          id: "brezet",
          title: "La roue de Brezet",
          cards: [
            {q:"Qui a mis au point la roue de Brezet et en quelle année a-t-elle été diffusée ?", a:"Mise en place à partir de 1994 par Carolien Van Hemmel, puis diffusée en 1997 par Han Brezet et Carolien Van Hemmel dans le guide \"Ecodesign\" publié par l'UNEP.", d:["Développée en 2011 par la revue Techniques de l'Ingénieur, pour répondre aux besoins des bureaux d'études français.","Créée par l'organisation internationale de normalisation ISO en 2006, en complément de la norme ISO 14006.","Inventée seule par Carolien Van Hemmel en 1980, bien avant la généralisation de l'analyse du cycle de vie."], w:"Retenir que c'est un outil ancien (1994-1997) et institutionnel (UNEP), pas une méthode récente inventée par un bureau d'études, une norme ISO, ni un outil antérieur aux débuts de l'ACV."},
            {q:"Combien d'axes de réflexion (stratégies d'écoconception) compte la roue de Brezet ?", a:"8 axes, dont le développement de nouveaux concepts (axe \"@\"), la sélection de matériaux à faible impact et l'optimisation du système de fin de vie.", d:["5 axes, chacun correspondant à une étape du cycle de vie du produit étudié.","10 axes, répartis à parts égales entre les trois niveaux composant, structure et système.","3 axes seulement, un pour chaque niveau du produit (composant, structure, système)."], w:"Le nombre exact (8) et la présence d'un axe \"concept\" à part des 7 axes d'amélioration incrémentale sont souvent demandés précisément : les autres décomptes proposés ne correspondent pas à la structure réelle de la roue."},
            {q:"Quels sont les trois niveaux du produit couverts par les 8 axes de la roue de Brezet ?", a:"Le niveau composant (axes 1 et 2 : matériaux), le niveau structure du produit (axes 3, 4 et 5 : production, distribution, utilisation) et le niveau système (axes 6, 7 et @ : durée de vie, fin de vie, nouveaux concepts).", d:["Le niveau matière, le niveau énergie consommée et le niveau transport jusqu'au client final.","Le niveau local, le niveau national et le niveau international de commercialisation du produit.","Le niveau conception du produit, le niveau production en usine et le niveau vente au client."], w:"La logique va du plus petit (composant/matériau) au plus grand (système) : ça aide à retrouver l'ordre des axes sur la roue, à ne pas confondre avec un découpage par ressource (matière/énergie/transport), par échelle géographique ou par étape commerciale."},
            {q:"Sous quelle forme visuelle la roue de Brezet est-elle représentée pour comparer un produit existant à un projet d'éco-innovation ?", a:"Un diagramme radar (\"toile d'araignée\"), avec un positionnement qualitatif (+ ou -) sur chacun des 8 axes.", d:["Un histogramme empilé, avec une barre par axe et un impact chiffré en kg équivalent CO2.","Une courbe de tendance linéaire, qui projette l'évolution de l'impact environnemental du produit dans le temps.","Un nuage de points d'ACV, positionnant chaque variante de produit selon son score environnemental global."], w:"Le format radar permet de visualiser d'un coup d'œil les axes déjà forts et ceux à améliorer, avec un positionnement qualitatif (+/-) et non un chiffrage précis comme le suggèrent les autres représentations proposées."},
            {q:"Quelles sont les trois sessions de la démarche d'éco-innovation construite autour de la roue de Brezet ?", a:"Session d'introduction et de sensibilisation, session de créativité, session de synthèse.", d:["Session de budget prévisionnel, session de prototypage physique, session de vente auprès des clients.","Une session de brainstorming libre, suivie d'un vote à main levée, puis d'une validation par la hiérarchie.","Une session d'audit du produit existant, une session de certification, une session de communication externe."], w:"La structure \"sensibilisation → créativité → synthèse\" suit une logique classique de démarche d'innovation, à distinguer d'étapes plus opérationnelles (budget, prototypage, vente) ou d'un format d'audit/certification/communication."},
            {q:"Dans la session de créativité, que désigne la \"phase divergente\" ?", a:"Générer un maximum d'idées sur chaque axe de la roue de Brezet, en ne considérant que les aspects environnementaux, sans juger les aspects techniques et économiques.", d:["Trier et sélectionner, parmi les idées déjà émises, celles qui seront effectivement mises en œuvre par l'équipe.","Présenter au groupe le bilan environnemental complet du produit existant, avant de commencer à chercher des idées.","Rédiger la version finale du cahier des charges fonctionnel du futur produit, une fois les idées validées."], w:"Diverger, c'est ne pas filtrer les idées tout de suite, pour ne pas tuer une bonne idée trop tôt en la jugeant trop vite sur le plan technique ou économique — contrairement au tri des idées, à la présentation d'un bilan ou à la rédaction d'un document final, qui interviennent à d'autres moments."},
            {q:"Que signifie l'ESQCV, citée comme outil d'évaluation environnementale préalable à la démarche de la roue de Brezet ?", a:"L'évaluation simplifiée et qualitative du cycle de vie, une alternative plus rapide et plus légère qu'une ACV complète.", d:["Une norme de sécurité européenne qui encadre la conception des jouets destinés aux enfants.","Un indicateur qui mesure la qualité de l'air à l'intérieur d'un bâtiment une fois le produit installé.","Un label de traçabilité du bois certifié, délivré par un organisme indépendant du type FSC/PEFC."], w:"C'est l'outil d'évaluation rapide utilisé en amont, avant de lancer une vraie ACV normée si l'idée est retenue ; ni une norme de sécurité, ni un indicateur de qualité de l'air, ni un label de traçabilité du bois."},
            {q:"Quel document est produit à l'issue de la session de synthèse pour chaque idée d'éco-innovation retenue ?", a:"Une fiche projet incluant description, objectifs, gains environnementaux potentiels, faisabilité technique et faisabilité économique.", d:["Un cahier des charges fonctionnel complet, listant l'ensemble des fonctions de service et contraintes du produit.","Un brevet déposé auprès de l'INPI, protégeant l'idée pour une durée maximale de 20 ans.","Un rapport d'ACV normé ISO 14044, quantifiant précisément les impacts environnementaux du nouveau concept."], w:"Elle sert de base de décision pour la direction : sans les volets technique et économique, l'idée reste un vœu pieux sans faisabilité démontrée ; un CdCF, un brevet ou une ACV normée sont d'autres documents, produits à d'autres moments du projet."},
            {q:"Pendant une session de créativité sur la roue de Brezet, un participant propose immédiatement : \"techniquement impossible, on oublie\" dès qu'une idée est lancée sur l'axe \"fin de vie\". Pourquoi cette réaction est-elle contraire à la méthode ?", a:"Parce qu'elle court-circuite la phase divergente, où l'on doit générer un maximum d'idées sur chaque axe sans juger leur faisabilité technique ou économique ; le tri ne doit intervenir qu'ensuite, en phase convergente.", d:["Parce que l'axe \"fin de vie\" est le seul axe de la roue où la faisabilité technique ne doit jamais être évaluée, même en phase convergente.", "Parce que seul l'animateur de la session a le droit d'émettre un avis sur la faisabilité technique d'une idée.", "Parce qu'une idée jugée irréalisable techniquement doit obligatoirement être retravaillée avant d'être formellement rejetée en session."], w:"C'est l'application directe de la règle \"diverger avant de converger\" vue sur la phase divergente : juger trop vite, quel que soit l'axe concerné, risque de tuer une idée environnementalement intéressante avant même de l'avoir explorée."}
          ]
        },
        {
          id: "af",
          title: "Analyse fonctionnelle",
          cards: [
            {q:"Que décrit l'analyse fonctionnelle du besoin, selon les normes NF X50-150 et ISO 16271 ?", a:"Le besoin auquel devra répondre le produit, sous forme de fonctions de service et de contraintes.", d:["Uniquement les contraintes réglementaires que le produit devra respecter, à l'exclusion de tout autre aspect du besoin.","Le plan de production détaillé décrivant comment le produit sera fabriqué une fois la solution technique choisie.","Le prix de revient prévisionnel du produit, estimé avant même d'avoir formulé la moindre fonction attendue."], w:"Elle décrit le \"quoi\" (le besoin, en fonctions de service et contraintes) avant le \"comment\" (la solution technique) : elle ne se limite pas aux contraintes réglementaires et ne porte ni sur la production ni sur le prix de revient."},
            {q:"Qu'est-ce que la \"bête à cornes\" et à quoi sert-elle ?", a:"Un outil qui formule le besoin fondamental d'un système en répondant à : à qui/quoi rend-il service, sur qui/quoi agit-il, dans quel but.", d:["Un diagramme de planification de type Gantt, utilisé pour répartir les tâches du projet dans le temps.","Une méthode de calcul de la résistance mécanique d'une pièce soumise à des efforts connus.","Un outil de calcul qui additionne les coûts de fabrication prévisionnels d'un produit."], w:"Les trois questions (à qui/quoi, sur qui/quoi, dans quel but) évitent de confondre le besoin réel avec une solution déjà imaginée à l'avance ; elle ne sert ni à planifier, ni à calculer une résistance, ni à chiffrer un coût."},
            {q:"Quelle est la différence entre une fonction principale et une fonction contrainte ?", a:"La fonction principale justifie la création du produit (pourquoi il existe) ; la fonction contrainte limite la liberté du concepteur sans justifier à elle seule l'existence du produit (sécurité, normes, adaptation au contexte...).", d:["La fonction principale est toujours de nature technique, alors que la fonction contrainte est toujours de nature esthétique.","Ce sont deux termes strictement synonymes, utilisés indifféremment selon les auteurs et les cours.","La fonction contrainte ne s'applique qu'aux produits électroniques, jamais aux produits mécaniques ou en bois."], w:"Une fonction contrainte peut disparaître sans tuer le produit (ex : une norme qui change), contrairement à la fonction principale qui est sa raison d'être ; la distinction ne porte ni sur technique/esthétique, ni sur un domaine de produit en particulier."},
            {q:"Qu'est-ce qu'une \"fonction d'estime\" ?", a:"Une fonction liée au goût de l'utilisateur, qui déclenche généralement l'acte d'achat (esthétique, image de marque...).", d:["Une fonction qui évalue objectivement la solidité mécanique du produit face aux sollicitations prévues.","Une fonction qui n'existe que pour les produits de luxe, absente du cahier des charges des produits courants.","Une fonction qui mesure l'impact environnemental du produit sur l'ensemble de son cycle de vie."], w:"Elle explique pourquoi deux produits équivalents techniquement ne se vendent pas pareil : le déclencheur est souvent subjectif (goût, image), pas une mesure objective de solidité, un statut \"produit de luxe\" ou un impact environnemental."},
            {q:"Quelle est la différence entre une fonction de service et une fonction technique ?", a:"La fonction de service répond à \"à quoi cela sert\" du point de vue de l'utilisateur ; la fonction technique répond à \"comment le faire\" du point de vue de la solution retenue.", d:["La fonction de service concerne uniquement la période d'après-vente, la fonction technique uniquement la fabrication initiale.","Ce sont deux étapes successives et chronologiques du cycle de vie du produit, l'une suivant toujours l'autre.","La fonction technique ne s'applique qu'aux produits logiciels, jamais aux produits physiques comme le mobilier."], w:"Une même fonction de service peut être remplie par plusieurs fonctions techniques différentes : c'est ce qui ouvre la place à la créativité en conception, et ce n'est ni une question de SAV/fabrication, ni une étape du cycle de vie, ni limité aux logiciels."},
            {q:"Qu'est-ce que le \"diagramme pieuvre\" en analyse fonctionnelle ?", a:"Un diagramme qui recense les éléments du milieu extérieur (EME) autour du produit, reliés par une fonction principale ou des fonctions contraintes.", d:["Un outil de calcul qui agrège plusieurs indicateurs d'une ACV multicritère en un seul score global.","Un planning de production représenté sous forme d'étoile, répartissant les tâches entre plusieurs postes de travail.","Une méthode de notation comparative des fournisseurs, utilisée lors du choix d'un sous-traitant."], w:"Il traduit visuellement le cahier des charges fonctionnel : chaque flèche du diagramme devient ensuite une ligne du tableau de fonctions ; il ne sert ni à calculer une ACV, ni à planifier, ni à noter des fournisseurs."},
            {q:"Comment doit-on formuler une fonction, selon la méthode vue en cours ?", a:"Un verbe à l'infinitif (l'action) suivi d'un complément (pour qui / sur quoi), sans préjuger d'une solution technique ni utiliser de négation.", d:["Toujours conjuguée au futur et à la première personne du singulier, comme un engagement personnel du concepteur.","Toujours sous la forme d'une question fermée appelant une réponse par oui ou par non.","Toujours réduite à un chiffre normalisé ISO, sans aucune formulation en langage courant."], w:"Éviter de préjuger une solution technique et la négation garde la porte ouverte à toutes les solutions possibles ; la forme attendue est \"verbe à l'infinitif + complément\", pas un futur à la première personne, une question fermée ou un simple chiffre."},
            {q:"Qu'est-ce que \"caractériser\" une fonction de service ?", a:"Définir un critère d'appréciation et lui attribuer un niveau de performance attendu, assorti d'une flexibilité (tolérance).", d:["Lui attribuer un prix de vente prévisionnel, destiné à figurer dans le futur devis du produit.","La classer par ordre alphabétique dans le tableau des fonctions du cahier des charges.","La traduire dans une autre langue, en vue d'une commercialisation du produit à l'export."], w:"Sans niveau ni flexibilité chiffrés, une fonction reste trop vague pour être vérifiée ou comparée entre plusieurs solutions ; caractériser ne consiste ni à fixer un prix, ni à classer alphabétiquement, ni à traduire."},
            {q:"Que signifie le sigle CdCf et que contient-il ?", a:"Cahier des charges fonctionnel : document qui exprime un besoin en fonctions de service et contraintes, avec pour chacune un critère d'appréciation, un niveau et une flexibilité (norme NF EN 16271).", d:["Un document à vocation uniquement commerciale, utilisé pour négocier le prix avec le client, sans valeur technique.","Code des Clauses Fiscales : un document administratif encadrant la fiscalité applicable au projet.","Un simple devis chiffré du projet, sans description des fonctions ni des contraintes à respecter."], w:"C'est le document pivot qui relie le besoin exprimé (fonctions de service et contraintes, chacune caractérisée) aux exigences chiffrées utilisées ensuite pour choisir matériaux et procédés ; ce n'est ni un document commercial, ni fiscal, ni un simple devis."},
            {q:"Pour une chaise de bureau, la fonction \"résister au poids de l'utilisateur\" et la fonction \"s'intégrer visuellement aux autres meubles du bureau\" sont-elles du même type ? Pourquoi ?", a:"Non : la première est une fonction principale (elle justifie l'existence même de la chaise, qui ne sert à rien si elle ne supporte pas l'utilisateur) ; la seconde est une fonction contrainte, qui limite les choix de style sans être la raison d'être du produit.", d:["Oui, les deux sont des fonctions principales, puisqu'elles portent toutes les deux sur un aspect du produit fini.","Oui, les deux sont des fonctions contraintes, puisqu'aucune des deux ne constitue à elle seule un argument de vente.","Non, mais c'est l'inverse : résister au poids est une fonction contrainte, s'intégrer visuellement est la fonction principale."], w:"C'est l'application directe de la distinction fonction principale / fonction contrainte vue plus haut : une chaise qui ne supporte pas l'utilisateur n'a plus de raison d'être, alors qu'une chaise disgracieuse mais solide reste fonctionnelle, même si elle se vend moins bien."}
          ]
        },
        {
          id: "demarche",
          title: "La démarche de conception",
          cards: [
            {q:"Selon le Grand Dictionnaire Terminologique, qu'est-ce que la conception en ingénierie ?", a:"Une activité créatrice qui consiste à élaborer un projet en partant des besoins exprimés, des moyens existants et des possibilités technologiques, dans le but de créer un bien ou un service.", d:["Uniquement la réalisation physique du prototype final, une fois toutes les décisions de conception déjà prises.","La vente du produit fini au client, une fois la conception et la fabrication entièrement terminées.","Le contrôle qualité réalisé en fin de chaîne de production, sur des produits déjà conçus et fabriqués."], w:"Elle rappelle que concevoir part toujours de trois éléments : un besoin, des moyens existants, et une technologie disponible — jamais d'une page blanche totale, et jamais d'une étape aussi tardive que le prototype, la vente ou le contrôle qualité final."},
            {q:"Quelle est la différence entre innovation, adaptation et modification en conception ?", a:"L'innovation crée un produit totalement nouveau (rare) ; l'adaptation transfère un principe existant à un nouveau contexte ; la modification optimise un produit existant (la plus fréquente).", d:["Ce sont trois synonymes qui désignent une seule et même démarche, employés selon les préférences de chaque auteur.","L'innovation ne concerne que les actions marketing autour du produit, la modification uniquement les aspects techniques.","L'adaptation est une démarche réservée aux produits de luxe, inapplicable aux produits de grande consommation."], w:"La modification est la plus fréquente en entreprise car la moins risquée et la moins coûteuse ; l'innovation pure reste rare car coûteuse et incertaine : la distinction ne tient ni du vocabulaire, ni du marketing/technique, ni d'un marché particulier."},
            {q:"Quelle est la différence entre un besoin et un désir, selon la pyramide de Maslow appliquée à la conception ?", a:"Le besoin est ce qui est vital pour l'utilisateur (attentes profondes) ; le désir est la manière dont il envisage d'y répondre, ce qui restreint davantage les solutions envisageables.", d:["Le désir est systématiquement plus rationnel et mieux justifié que le besoin, qui reste purement émotionnel.","Le besoin, au sens de la pyramide de Maslow appliquée à la conception, ne concerne que les produits alimentaires et de première nécessité.","Ce sont des synonymes interchangeables dans la rédaction d'un cahier des charges, sans conséquence sur les solutions envisagées."], w:"Confondre les deux fait souvent rater le vrai problème à résoudre : le désir n'est qu'une solution parmi d'autres pour satisfaire le besoin réel, qui n'est ni purement émotionnel, ni réservé à l'alimentaire, ni interchangeable avec le désir."},
            {q:"Pourquoi faut-il distinguer le client de l'utilisateur dans une démarche de conception ?", a:"Le client est celui qui achète, l'utilisateur celui qui bénéficie du produit ; il faut satisfaire les deux pour concevoir judicieusement (ex : un parent achète un jouet pour son enfant).", d:["Parce que l'utilisateur n'a, par définition, jamais la moindre influence sur la décision d'achat du produit.","Parce que seul le client doit être pris en compte dans une démarche de conception, l'utilisateur restant secondaire.","Parce que la réglementation française impose cette distinction pour tout produit commercialisé sur le territoire."], w:"Concevoir uniquement pour le client sans penser à l'utilisateur peut créer un produit mal adapté à l'usage réel ; ce n'est ni une question d'absence totale d'influence, ni une priorité légale, ni une obligation réglementaire."},
            {q:"Quelles sont les 6 grandes étapes de la démarche générale de conception présentée en cours ?", a:"Identification des besoins, conceptualisation des solutions (idéation), recherche des solutions techniques, sélection des meilleures solutions, modélisation, réalisation.", d:["Vente du produit, production en série, contrôle qualité, service après-vente, recyclage, archivage du dossier.","Idée initiale, dépôt de brevet, fabrication du prototype, lancement en production, campagne marketing, distribution.","Rédaction du cahier des charges, établissement d'un devis, facturation, livraison au client, garantie, clôture du dossier."], w:"Retenir l'ordre logique : on identifie d'abord le besoin, puis on explore des idées, avant de chercher des solutions techniques précises ; les trois autres séquences mélangent des étapes commerciales, administratives ou de production qui ne correspondent pas à cette démarche de conception."},
            {q:"Qu'est-ce que la notion d'itération dans la démarche de conception ?", a:"Le fait de revenir de manière cyclique sur une étape précédente pour l'améliorer en continu, sans jamais arrêter de chercher d'autres solutions alternatives.", d:["La répétition à l'identique du même prototype, réalisée plusieurs fois pour vérifier la reproductibilité de la fabrication.","Le principe selon lequel on ne doit jamais revenir sur une décision de conception une fois qu'elle a été prise.","Une étape obligatoire du projet, réservée exclusivement à la toute fin de la démarche de conception."], w:"L'itération n'est pas un échec : c'est une boucle volontaire d'amélioration, différente d'une simple répétition à l'identique, d'un refus de revenir en arrière, ou d'une étape figée en fin de projet."},
            {q:"Quels sont les trois grands types d'évaluation des performances d'une solution technique ?", a:"La simulation numérique, l'expérimentation (sur une partie du produit) et le prototypage (sur le produit complet).", d:["Le vote à main levée, la recherche de consensus en réunion et le tri croisé des idées proposées.","L'ACV, l'analyse coûts-bénéfices (ACB) et l'AMDEC, trois outils réservés à l'évaluation environnementale et à la fiabilité.","Le benchmarking concurrentiel, le sondage auprès des clients et l'entretien individuel avec les utilisateurs."], w:"Du moins coûteux (simulation) au plus coûteux (prototype complet) : on les utilise généralement dans cet ordre pour limiter les risques et les coûts ; les autres outils cités (vote, ACV/ACB/AMDEC, étude de marché) interviennent à d'autres moments ou pour d'autres objectifs du projet."},
            {q:"Quelle est la différence entre un croquis de principe et un croquis technique ?", a:"Le croquis de principe privilégie l'aspect esthétique pour présenter un concept ; le croquis technique privilégie la compréhension détaillée d'une solution technique (dimensions, assemblages...).", d:["Le croquis technique est obligatoirement réalisé sur ordinateur, le croquis de principe obligatoirement réalisé à la main.","Ce sont deux termes strictement équivalents, l'un étant simplement l'appellation anglaise de l'autre.","Le croquis de principe n'est utilisé qu'en toute fin de projet, pour présenter le produit terminé au client final."], w:"Le croquis de principe sert à vendre une idée, le croquis technique sert à la fabriquer : deux publics, deux objectifs différents, indépendamment de l'outil utilisé (main ou ordinateur) ou du moment du projet."},
            {q:"Que protège un brevet et pour quelle durée maximale en France ?", a:"Une innovation technique (produit ou procédé) nouvelle, impliquant une activité inventive et une application industrielle ; protection maximale de 20 ans, obtenue auprès de l'INPI.", d:["Toute idée, y compris une idée non technique ou abstraite, sans limite de durée une fois le dépôt accepté.","Uniquement les marques commerciales d'une entreprise, protégées pour une durée de 10 ans renouvelable.","Uniquement l'aspect esthétique extérieur d'un produit, protégé pour une durée maximale de 5 ans."], w:"Les trois conditions (nouveauté, activité inventive, application industrielle) doivent être réunies ensemble pour une durée maximale de 20 ans : le brevet ne protège ni une idée abstraite sans limite, ni une marque, ni le seul aspect esthétique (qui relève d'autres protections)."},
            {q:"Un ingénieur reprend un système d'attache déjà utilisé dans l'automobile pour l'appliquer, sans le modifier, à un nouveau meuble de bureau. De quel type de démarche de conception s'agit-il ?", a:"D'une adaptation : un principe existant, déjà validé dans un autre contexte, est transféré vers un nouveau contexte d'usage, sans qu'il s'agisse d'une invention totalement nouvelle ni d'une simple optimisation d'un produit déjà existant.", d:["D'une innovation pure, puisque ce système d'attache n'avait jamais été utilisé dans le secteur du mobilier de bureau auparavant.", "D'une modification, puisque le système d'attache reste rigoureusement identique à celui utilisé dans l'automobile.", "D'aucune démarche de conception reconnue, puisqu'aucun nouveau composant n'a été inventé pour ce projet."], w:"C'est l'application directe de la distinction innovation / adaptation / modification vue plus haut : changer de contexte d'usage sans changer le principe lui-même est la définition même de l'adaptation, ni une innovation (rien de nouveau n'est inventé), ni une modification (qui porterait sur un produit déjà existant dans ce contexte)."}
          ]
        },
        {
          id: "multimat",
          title: "Approche multi-matériaux",
          cards: [
            {q:"Quelle est la différence entre un alliage et un composite ?", a:"Un alliage est un mélange de matériaux miscibles (ex : acier) ; un composite est un assemblage de matériaux non miscibles, typiquement une matrice et un renfort (ex : contreplaqué, béton).", d:["Ce sont deux termes strictement synonymes, l'un étant la désignation technique de l'autre selon les normes.","Le terme alliage ne s'applique qu'aux matériaux de la famille des polymères, jamais aux métaux.","Un composite est par définition toujours biosourcé, contrairement à un alliage qui serait toujours pétrosourcé."], w:"La miscibilité tranche : un alliage forme une seule phase homogène, un composite garde ses constituants distincts et visibles ; la distinction ne tient ni du vocabulaire, ni de la famille polymère/métal, ni de l'origine biosourcée ou non."},
            {q:"Dans un matériau composite, quel est le rôle respectif de la matrice et du renfort ?", a:"Le renfort assure les propriétés mécaniques du composite ; la matrice répartit les sollicitations mécaniques sur le renfort et le protège (UV, abrasion, température).", d:["La matrice assure seule la résistance mécanique du composite, le renfort ne servant qu'à le protéger des UV.","Les deux jouent un rôle strictement identique et peuvent être interchangés sans conséquence sur les propriétés du composite.","Le renfort n'a qu'un rôle esthétique, la matrice assurant seule l'ensemble des fonctions mécaniques et de protection."], w:"Retenir le partage des rôles : le renfort porte la charge mécanique, la matrice transmet et protège — aucun des deux ne suffit seul, et leurs rôles ne sont ni inversés, ni interchangeables, ni réduits à l'esthétique."},
            {q:"D'après la définition de l'ADEME (2025) citée en cours, qu'est-ce qu'un composite biosourcé ?", a:"Un composite renforcé par des fibres naturelles, indépendamment de la nature de la matrice qui peut être biosourcée ou non.", d:["Un composite dont la matrice ET le renfort doivent obligatoirement être tous les deux biosourcés pour mériter cette appellation.","Un composite composé uniquement de bois massif, à l'exclusion de toute fibre naturelle d'une autre origine végétale.","Tout matériau recyclable en fin de vie, qu'il contienne ou non des fibres naturelles dans sa composition."], w:"Le critère porte uniquement sur le renfort (fibres naturelles) : une matrice pétrosourcée n'empêche donc pas d'appeler le composite \"biosourcé\", contrairement à une exigence sur les deux composants, au bois massif seul, ou à un critère de recyclabilité."},
            {q:"Selon la classification par liaison chimique, à quelle famille appartient le bois et quelles en sont les propriétés principales ?", a:"Famille des polymères (liaison covalente) : mise en forme relativement facile, température d'usage limitée, isolant thermique et électrique.", d:["Famille des métaux, caractérisée par une bonne conductivité électrique et une grande dureté.","Famille des céramiques, caractérisée par une grande résistance thermique mais une forte fragilité.","Famille des composites, puisqu'il s'agit par définition d'un assemblage d'au moins deux matières différentes."], w:"Le classement se fait par type de liaison chimique, pas par origine (naturelle/synthétique) ni par apparence visuelle : d'où le bois rejoint la famille des polymères, et non celle des métaux, céramiques ou composites."},
            {q:"Qu'est-ce qu'un \"indice de performance\" en sélection de matériaux ?", a:"Un indicateur qui combine plusieurs propriétés (ex : résistance/masse volumique) pour comparer objectivement des matériaux vis-à-vis d'un objectif donné (ex : minimiser le poids à résistance égale).", d:["Le prix au kilogramme du matériau, seul critère retenu pour comparer objectivement plusieurs candidats.","Une note qualitative attribuée par un expert du secteur, sans aucun calcul à partir des propriétés du matériau.","La durée de vie garantie par le fabricant, utilisée seule pour classer les matériaux candidats entre eux."], w:"Un indice de performance combine toujours au moins deux propriétés physiques du matériau : comparer une seule propriété isolée (prix, avis d'expert, durée de garantie) ne suffit pas à le définir."},
            {q:"Pourquoi le bois est-il souvent avantageux face à l'acier sur un diagramme d'Ashby (module d'élasticité / masse volumique) ?", a:"Parce qu'à rigidité comparable, le bois est beaucoup plus léger que l'acier (manutention et mise en œuvre facilitées), tout en restant plus rigide et résistant que les élastomères.", d:["Parce que le module d'élasticité du bois est, dans l'absolu, toujours supérieur à celui de l'acier.","Parce que le bois est systématiquement moins cher à l'achat que l'acier, quelle que soit l'essence considérée.","Parce que le diagramme d'Ashby ne prend en compte que le critère du prix des matériaux comparés."], w:"Le diagramme d'Ashby compare rigidité et masse volumique ensemble : le bois gagne sur le rapport rigidité/poids, pas sur la rigidité brute (qui reste inférieure à celle de l'acier), ni sur le prix, qui n'est pas l'axe du diagramme."},
            {q:"Que représentent les trois composantes [matériau, procédé, forme] dans le choix d'une solution technique ?", a:"La fonction d'un composant est assurée par la combinaison de ces trois éléments ; la forme et le matériau choisis limitent les procédés possibles, et inversement.", d:["Trois étapes totalement indépendantes du projet, sans aucune influence de l'une sur les deux autres.","Trois critères réservés exclusivement à l'évaluation environnementale d'un produit déjà conçu.","Les trois phases obligatoires d'une analyse du cycle de vie, menées dans cet ordre précis."], w:"Ces trois éléments se contraignent mutuellement : changer un matériau peut imposer de changer de procédé ou de revoir la forme ; ce ne sont ni des étapes indépendantes, ni des critères d'évaluation environnementale, ni des phases d'ACV."},
            {q:"Qu'est-ce qu'une FDES (Fiche de Déclaration Environnementale et Sanitaire) ?", a:"Un document normé (NF EN 15804) décrivant les impacts environnementaux d'un matériau ou produit de construction sur une unité fonctionnelle donnée, disponible notamment sur la base INIES.", d:["Un certificat de garantie commerciale délivré par le fabricant, sans valeur environnementale normée.","Une fiche de sécurité incendie obligatoire, exigée pour tout matériau utilisé en construction.","Un document réservé aux matériaux plastiques, sans équivalent pour le bois ou les matériaux minéraux."], w:"C'est l'équivalent, pour les produits de construction, d'une ACV normalisée et publique : la base INIES centralise ces fiches en France ; ce n'est ni une garantie commerciale, ni un document de sécurité incendie, ni un outil réservé au plastique."},
            {q:"Pourquoi faut-il être prudent avec les valeurs moyennes des matériaux biosourcés lors d'un choix de matériau ?", a:"Parce qu'ils sont par nature très variables (hétérogénéité du bois par exemple) : une valeur moyenne seule peut conduire à une décision peu robuste, il faut tenir compte de l'incertitude.", d:["Parce que les matériaux biosourcés n'ont, à proprement parler, aucune propriété mécanique réellement mesurable en laboratoire.","Parce que la base de données Granta ne contient, à ce jour, aucune donnée concernant les matériaux biosourcés.","Parce que la réglementation française interdit l'utilisation de matériaux biosourcés dans un usage structurel."], w:"Une moyenne ignore la variabilité naturelle du bois : deux lots du même matériau peuvent avoir des propriétés assez différentes, ce qui n'a rien à voir avec une absence de propriété mesurable, un manque de données ou une interdiction réglementaire."},
            {q:"Pour une même fonction (ex : une étagère qui doit supporter une charge donnée sans trop fléchir), pourquoi le choix entre le bois et l'acier peut-il changer selon qu'on raisonne en indice de performance \"à masse minimale\" ou en indice de performance \"à coût minimal\" ?", a:"Parce que ce sont deux indices de performance différents, construits à partir de propriétés différentes du matériau (masse volumique dans un cas, prix au kilo dans l'autre) : un matériau optimal pour l'un n'est pas automatiquement optimal pour l'autre.", d:["Parce que le module d'élasticité d'un matériau change selon le critère économique ou technique retenu par l'ingénieur.", "Parce qu'un seul indice de performance existe réellement en sélection de matériaux, les autres n'étant que des approximations commerciales.", "Parce que le diagramme d'Ashby interdit de comparer deux matériaux dès qu'un critère économique est ajouté à l'étude."], w:"C'est l'application directe de la définition de l'indice de performance vue plus haut : changer l'objectif (masse minimale vs coût minimal) change l'indice à maximiser, donc potentiellement le matériau qui sort gagnant de la comparaison."}
          ]
        },
        {
          id: "procedes",
          title: "Procédés de fabrication et impact environnemental",
          cards: [
            {q:"Quelle est la différence entre un flux poussé et un flux tiré en production ?", a:"En flux poussé, la fabrication est lancée sur prévision des ventes avant la commande client (grandes séries, marge faible, objectif : optimiser le process) ; en flux tiré, elle démarre sur demande réelle du client (petites séries, marge forte, objectif : respecter le délai).", d:["Le flux poussé ne concerne que la fabrication de produits uniques sur mesure, le flux tiré uniquement les grandes séries standardisées.","Ce sont deux étapes qui se succèdent systématiquement dans un même processus de fabrication, l'une après l'autre.","Le flux tiré est une organisation réservée à la fabrication de produits à partir de matières recyclées."], w:"Le flux poussé répond à \"combien produire pour l'avenir\", le flux tiré à \"que produire pour cette commande précise\" : deux logiques opposées, qui ne tiennent ni du caractère unique/série du produit, ni d'un enchaînement chronologique, ni de l'origine recyclée ou non de la matière."},
            {q:"Quelle est la différence entre une machine-outil et une ligne de production ?", a:"Une machine-outil façonne seule un produit grâce à une source d'énergie ; une ligne de production est un ensemble de machines-outils cadencées et reliées entre elles pour transformer un produit selon une approche de lot de production.", d:["Ce sont deux termes strictement synonymes, la \"ligne de production\" étant simplement l'appellation industrielle de la machine-outil.","Une ligne de production, par définition, ne comporte jamais la moindre machine-outil parmi ses équipements.","Une machine-outil isolée est toujours plus productive, à elle seule, qu'une ligne de production complète."], w:"Une ligne de production est un assemblage de plusieurs machines-outils synchronisées : comprendre chaque machine aide à comprendre la ligne entière ; ce ne sont ni des synonymes, ni des éléments exclusifs l'un de l'autre, ni comparables en productivité brute de cette façon."},
            {q:"Quelle est la différence entre une MOPN et une MOCN ?", a:"La MOPN (positionnement numérique) nécessite l'intervention d'un opérateur pour réaliser l'usinage malgré un réglage numérique ; la MOCN (commande numérique) réalise l'usinage sans intervention de l'opérateur.", d:["La MOPN est, par construction, toujours un modèle de machine plus récent que la MOCN sur le marché.","Ce sont deux termes qui désignent exactement la même catégorie de machine, selon le vocabulaire utilisé par le fabricant.","La MOCN ne peut usiner que du bois massif, alors que la MOPN serait réservée exclusivement aux panneaux."], w:"La différence porte uniquement sur l'usinage (avec ou sans intervention de l'opérateur), le réglage étant numérique dans les deux cas ; elle ne tient ni d'une ancienneté technologique, ni d'un simple synonyme, ni d'une limite massif/panneau."},
            {q:"Pourquoi une CNC 5 axes est-elle généralement utilisée sur du bois massif plutôt que sur du panneau ?", a:"Parce qu'elle combine 3 translations et 2 rotations (hors rotation outil), ce qui permet d'usiner des formes complexes en volume, alors qu'une CNC 3 axes (translations seules) suffit pour le travail à plat du panneau.", d:["Parce qu'une CNC 5 axes coûte systématiquement moins cher à l'achat qu'une CNC 3 axes équivalente.","Parce qu'un panneau, par nature, ne peut techniquement pas être usiné par une machine à commande numérique.","Parce que l'usinage d'un panneau en CNC 3 axes est réservé exclusivement au secteur de la construction."], w:"Plus d'axes = plus de liberté de mouvement autour de la pièce, utile pour des formes en volume plutôt que pour un usinage à plat ; la différence ne tient ni du prix, ni d'une impossibilité technique sur panneau, ni d'une limite sectorielle."},
            {q:"D'après l'exemple d'ACV simplifiée d'une CNC vu en cours, quelle phase du cycle de vie de la machine génère le plus de CO2 ?", a:"La phase d'utilisation (consommation électrique de la machine), largement devant la production de l'équipement, le transport et la fin de vie.", d:["La phase de transport de la machine depuis le fabricant jusqu'au site de l'usine qui l'exploite.","La phase de fabrication de la machine elle-même, avant sa première mise en service dans l'atelier.","La phase de fin de vie de la machine, incluant son démontage et son recyclage en fin d'exploitation."], w:"Règle générale en écoconception des équipements industriels : l'usage pèse souvent plus lourd que la fabrication de la machine elle-même, loin devant le transport ou la fin de vie."},
            {q:"Pourquoi l'emplacement géographique du site de production influence-t-il fortement l'empreinte carbone d'une machine-outil en service ?", a:"Parce que l'impact carbone de la phase d'utilisation dépend directement du mix énergétique du pays (part de production électrique décarbonée ou non).", d:["Parce que seul le prix local de l'électricité détermine l'empreinte carbone d'une machine, indépendamment de son origine.","Parce qu'une même machine-outil consomme une quantité d'énergie différente selon le climat du pays où elle est installée.","Parce que les normes de sécurité applicables localement modifient directement la consommation électrique de la machine."], w:"Deux machines identiques peuvent avoir des bilans carbone très différents simplement parce qu'elles sont installées dans des pays à mix électrique différent, pas parce que le prix de l'électricité, le climat ou les normes de sécurité changeraient la consommation elle-même."},
            {q:"Pour comparer équitablement deux machines-outils sur le plan environnemental, quelle notion faut-il impérativement appliquer ?", a:"L'unité fonctionnelle : comparer deux machines qui produisent le même résultat (même nombre de pièces conformes) dans les mêmes conditions ; si une machine est deux fois plus lente, son impact \"utilisation\" doit être doublé pour la comparaison.", d:["Le prix d'achat de chaque machine, rapporté à sa durée de garantie constructeur.","La date de mise sur le marché de chaque machine, les modèles les plus récents étant présumés plus performants.","La couleur et la marque commerciale de chaque machine, souvent associées par les utilisateurs à un niveau de qualité perçu."], w:"Comparer la consommation brute de deux machines sans tenir compte de leur vitesse de production fausse totalement la comparaison ; c'est le même principe que l'unité fonctionnelle vue en ACV, pas une question de prix, d'ancienneté ou d'image de marque."},
            {q:"Selon les données FCBA citées en cours, quels sont les postes les plus consommateurs d'énergie électrique dans une scierie ?", a:"Le sciage premier débit (scies de tête, slabber), le séchage, l'aspiration et l'air comprimé.", d:["L'éclairage et le chauffage des bureaux administratifs du site de la scierie.","Le transport routier des grumes depuis la forêt jusqu'au site de la scierie.","L'emballage des produits finis avant leur expédition vers les clients."], w:"Le sciage premier débit domine car c'est l'étape qui enlève le plus de matière avec le plus de puissance mécanique mobilisée, loin devant les bureaux administratifs, le transport routier ou l'emballage final."},
            {q:"Deux ateliers usinent la même pièce en bois massif comportant une forme galbée en volume : l'un avec une CNC 3 axes en plusieurs reprises et retournements manuels de la pièce, l'autre avec une CNC 5 axes en une seule opération continue. Pourquoi l'option 5 axes est-elle souvent plus pertinente ici, au-delà du seul critère de temps de cycle ?", a:"Parce que les 2 rotations supplémentaires permettent d'atteindre toutes les faces de la forme galbée sans retourner manuellement la pièce, ce qui réduit les reprises, les risques d'erreur de positionnement et donc potentiellement la non-qualité, en plus du gain de temps.", d:["Parce qu'une CNC 5 axes consomme systématiquement moins d'énergie électrique qu'une CNC 3 axes, quelle que soit la pièce usinée.","Parce qu'une CNC 3 axes est, par construction, incapable d'usiner une pièce en bois massif, contrairement à une CNC 5 axes.","Parce que le nombre d'axes d'une machine n'a aucune incidence sur la nécessité de retourner ou non la pièce en cours d'usinage."], w:"C'est l'application concrète de la différence 3 axes / 5 axes vue plus haut (translations seules vs translations + rotations) : plus d'axes signifie plus de liberté de mouvement autour de la pièce, donc moins de manipulations manuelles sur une forme complexe en volume."}
          ]
        },
        {
          id: "vocab",
          title: "Vocabulaire des procédés bois",
          cards: [
            {q:"Quelle est la différence entre une grume et une bille, dans le vocabulaire de la scierie ?", a:"La grume est le tronc d'arbre abattu, ébranché et écimé, prêt à être débité ; la bille est une section de grume destinée au sciage.", d:["Ce sont deux synonymes strictement interchangeables, utilisés indifféremment selon les régions de production.","La bille désigne uniquement le bois une fois qu'il est passé par l'étape de séchage en cellule climatisée.","La grume désigne le produit fini, une fois que les planches ont été rabotées à leurs dimensions définitives."], w:"La grume est l'état brut après abattage, la bille en est une portion calibrée prête à entrer en scierie : un mot désigne l'origine, l'autre la section de travail, et ni le séchage ni le rabotage n'entrent dans cette distinction."},
            {q:"Qu'est-ce qu'un avivé et en quoi diffère-t-il d'un carrelet ?", a:"L'avivé est une poutre de bois massif brute de sciage sur ses 4 faces (non rabotée) ; le carrelet est reconstitué par collage/aboutage puis scié et raboté aux dimensions finies.", d:["Ce sont deux termes qui désignent exactement le même produit, l'un étant l'appellation régionale de l'autre.","L'avivé est, par définition, toujours plus long qu'un carrelet, quelle que soit la commande passée.","Le carrelet désigne uniquement les pièces de bois massif destinées à l'export vers l'étranger."], w:"L'avivé garde les traces de sciage (brut), le carrelet est un produit retravaillé (collé, raboté) : le carrelet est toujours plus élaboré, indépendamment de la longueur des pièces ou de leur destination commerciale."},
            {q:"Qu'appelle-t-on la \"dosse\" en sciage ?", a:"La première et la dernière planche sciée dans un tronc, avec une face plane et l'autre bombée (côté écorce).", d:["La plus belle planche obtenue lors du sciage, réservée en priorité aux produits haut de gamme.","Le nom donné à la sciure fine récupérée en fin d'opération de sciage du tronc.","La pièce centrale du tronc, considérée comme la plus résistante mécaniquement de toutes."], w:"La dosse est la première coupe avant d'atteindre le bois droit et utilisable, donc souvent un sous-produit plutôt qu'un produit noble ; ce n'est ni la plus belle planche, ni de la sciure, ni la pièce centrale la plus résistante."},
            {q:"Que mesure le \"rendement matière\" en scierie ?", a:"Le rapport entre le volume de produits finis obtenus et le volume de grumes utilisées en entrée.", d:["Le nombre d'heures de production réalisées chaque jour par l'ensemble de la scierie.","Le pourcentage de bois certifié FSC ou PEFC utilisé parmi les grumes entrées en scierie.","La vitesse d'avance des grumes sur la ligne de sciage, exprimée en mètres par minute."], w:"Un rendement matière faible signifie beaucoup de perte (sciure, chutes) par rapport au volume de grume entré : un indicateur clé d'efficacité, distinct du temps de production, du taux de certification ou de la vitesse de la ligne."},
            {q:"En construction bois, qu'est-ce que le \"contreventement\" d'une structure ?", a:"L'ensemble des éléments qui assurent la stabilité d'une structure face aux forces horizontales (vent, séisme...).", d:["Le revêtement extérieur qui protège les murs d'un bâtiment contre les intempéries et les UV.","La membrane qui empêche la diffusion de vapeur d'eau à travers les parois du bâtiment.","L'élément triangulé de charpente qui supporte directement le poids de la toiture."], w:"Sans contreventement, une ossature reste stable verticalement mais peut se déformer latéralement sous le vent ; ce rôle n'est ni celui d'un revêtement extérieur, ni d'un pare-vapeur, ni d'un simple élément porteur de toiture."},
            {q:"Quelle est la différence entre une maison \"poteaux-poutres\" et une maison à \"ossature bois\" (MOB) ?", a:"La maison poteaux-poutres utilise de grandes sections de bois (poteaux, poutres) avec des remplissages entre elles ; la MOB repose sur une structure de montants et traverses de plus petite section, isolée entre les éléments.", d:["Ce sont deux appellations commerciales différentes pour désigner une seule et même technique constructive.","Une maison à ossature bois (MOB) ne comporte, par définition, jamais aucun panneau de contreventement.","Une maison poteaux-poutres est toujours construite en bois massif empilé horizontalement, comme un chalet en madriers."], w:"La différence de section (grande vs petite) change toute la logique constructive : remplissage libre pour poteaux-poutres, isolation intégrée pour la MOB ; ce n'est ni un simple nom commercial, ni une absence systématique de contreventement, ni une construction en madriers empilés."},
            {q:"Qu'est-ce qu'un panneau \"CLT\" en construction bois ?", a:"Un panneau massif en bois lamellé-croisé (couches de lames collées perpendiculairement les unes aux autres), utilisé pour former murs et planchers.", d:["Un panneau de particules bon marché, principalement utilisé pour la fabrication d'emballages industriels.","Un panneau de fibres (MDF) à haute densité, utilisé essentiellement dans l'industrie de l'ameublement.","Un contreplaqué fin, réservé à la réalisation de coffrages temporaires sur les chantiers de construction."], w:"Le croisement des couches donne au CLT sa résistance dans les deux directions, contrairement à une planche massive qui ne travaille bien que dans le sens du fil ; ce n'est ni un panneau de particules, ni un MDF, ni un contreplaqué de coffrage."},
            {q:"Dans le processus généralisé de fabrication en construction bois, quelles sont les 4 grandes étapes ?", a:"Débit, taillage, assemblage, montage.", d:["Sciage de la grume, séchage en cellule, rabotage des pièces, conditionnement avant expédition.","Conception du projet, prototypage de la structure, production en série, livraison au client.","Abattage de l'arbre, transport jusqu'au site, stockage en scierie, vente du produit fini."], w:"Retenir l'ordre : on débite et taille les pièces en atelier avant de les assembler, puis on monte sur le chantier ; les autres séquences décrivent soit l'amont scierie, soit un processus industriel générique, pas ce processus de fabrication en construction bois."},
            {q:"Quelle est la fonction d'une \"corroyeuse\" en atelier bois ?", a:"Raboter des pièces à la section désirée sur 2 à 4 faces simultanément, à l'aide de plusieurs arbres d'usinage.", d:["Assembler les panneaux de contreventement directement sur une table de montage dédiée.","Scanner les grumes afin de détecter leurs défauts internes avant le premier sciage.","Sécher le bois massif à l'intérieur d'une cellule climatisée, après son débit en scierie."], w:"Elle met les faces d'une pièce à l'équerre et à la bonne section : une étape de précision avant tout usinage complémentaire, ni un poste d'assemblage, ni un scanner, ni un séchoir."},
            {q:"Qu'est-ce qu'un \"slabber\" en tête de ligne de sciage ?", a:"Une machine qui traite les deux faces d'une grume en éliminant les dosses, puis broie ces dosses en copeaux.", d:["Une machine qui mesure et scanne la grume afin d'optimiser le plan de sciage avant toute découpe.","Une presse hydraulique qui assemble les fermettes industrielles destinées à la charpente.","Un séchoir à air chaud climatisé, utilisé pour sécher le bois une fois qu'il a été débité."], w:"Le slabber transforme un déchet de forme (la dosse) en sous-produit valorisable (copeaux), plutôt que de le laisser comme perte pure ; ce n'est ni un scanner de grume, ni une presse à fermettes, ni un séchoir."},
            {q:"Qu'est-ce que la \"contremarque\" en gestion de production ?", a:"Une méthode où les articles sont fabriqués uniquement après réception d'une commande client ferme (par opposition à la production sur stock).", d:["Une méthode de contrôle qualité appliquée systématiquement aux pièces finies avant expédition.","Un type d'étiquetage réglementaire obligatoire sur tout meuble commercialisé en France.","Une remise commerciale accordée automatiquement aux clients passant de grosses commandes."], w:"C'est l'équivalent, côté vocabulaire métier, du \"flux tiré\" vu au chapitre procédés : produire seulement sur commande ferme, pas un contrôle qualité, un étiquetage réglementaire ou une remise commerciale."},
            {q:"Que signifie travailler \"au défilé\" dans un atelier de production ?", a:"Les pièces passent successivement par différents postes de travail fixes, sans s'arrêter ou presque, donc sans zone de stockage intermédiaire entre les postes.", d:["Une méthode de production artisanale, pièce par pièce, sans passer par aucune ligne organisée.","Le fait de ne faire fonctionner l'atelier que la nuit, afin de limiter les coûts de l'énergie consommée.","Un mode de production réservé aux commandes destinées à être vendues à l'export."], w:"Travailler au défilé suppose une ligne cadencée en continu, à l'opposé d'un atelier où chaque machine traite ses pièces par lots séparés ; ce n'est ni de l'artisanat sans ligne, ni une question d'horaire de nuit, ni un mode réservé à l'export."},
            {q:"Qu'est-ce que le \"nesting\" sur un centre d'usinage CNC ?", a:"Une technique d'usinage et de découpe optimisée de pièces imbriquées dans un panneau, pour maximiser le rendement matière.", d:["Une opération qui consiste à coller plusieurs panneaux entre eux pour obtenir une épaisseur donnée.","Un type de finition de surface appliqué au pistolet, à base de vernis ou de laque.","Le stockage automatisé des panneaux bruts, avant leur prise en charge par le centre d'usinage."], w:"Le nesting optimise le placement des pièces sur le panneau pour réduire les chutes, un levier direct d'écoconception par réduction de matière ; ce n'est ni du collage, ni une finition de surface, ni du stockage."},
            {q:"Qu'est-ce que le \"Système 32\" dans l'industrie du meuble ?", a:"Un entraxe standardisé de perçages, qui permet une grande flexibilité dans l'ajout de quincailleries et facilite l'assemblage des meubles.", d:["Une norme de sécurité incendie applicable spécifiquement aux meubles destinés aux bureaux.","Un format de panneau de bois standardisé, harmonisé à l'échelle de l'Union européenne.","Un protocole de communication numérique utilisé pour synchroniser plusieurs machines CNC entre elles."], w:"La standardisation de l'entraxe permet d'utiliser des quincailleries de marques différentes sur le même meuble, sans redessiner chaque fois les perçages ; ce n'est ni une norme incendie, ni un format de panneau, ni un protocole numérique."},
            {q:"Quelle est la différence entre postformage et softformage des chants de panneaux ?", a:"Le postformage plie à chaud un stratifié pour recouvrir le chant en continuité avec la surface ; le softformage utilise un film PVC souple ou un stratifié fin, permettant des profils plus complexes et un arrondi doux.", d:["Ce sont deux noms différents pour un seul et même procédé, selon le pays où il est pratiqué.","Le softformage ne peut s'appliquer qu'à des chants de pièces en bois massif, jamais à des panneaux.","Le postformage revient systématiquement moins cher à mettre en œuvre que le softformage, quel que soit le profil recherché."], w:"Softformage = matériaux plus souples donc formes plus complexes possibles ; postformage = procédé plus classique, limité à des profils plus simples ; la différence ne tient ni du pays, ni d'une limite au bois massif, ni d'un écart de coût systématique."},
            {q:"Qu'est-ce qu'un \"caisson\" en ameublement ?", a:"Un élément de base de forme rectangulaire qui constitue la structure principale de nombreux meubles, en particulier les meubles de rangement.", d:["Un système d'aspiration des copeaux installé au-dessus des machines de l'atelier.","Un type d'emballage renforcé, utilisé pour protéger les meubles pendant leur transport.","La partie supérieure d'une table de montage, sur laquelle sont posées les pièces en cours d'assemblage."], w:"Le caisson est littéralement la \"boîte\" de base du meuble, sur laquelle viennent ensuite se fixer façades, tiroirs et quincailleries ; ce n'est ni un système d'aspiration, ni un emballage, ni une partie de table de montage."}
          ]
        },
        {
          id: "pratique",
          title: "Infos pratiques : évaluation et équipe",
          cards: [
